<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ver+ Investment Process Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: the same instrument panel as the 5-Year Plan guide, read one stop at a time. Learning path: Learn the map → Decide → Score → Simulate → Practice → Keep. */
:root{
  --bg:#EFEFE4; --surface:#F7F6EE; --panel:#000000; --panel-2:#1A1A1A;
  --fg:#0B0B0A; --fg-2:#3A3A36; --muted:#6E6E66; --line:#D2D2C6; --line-strong:#9C9C90;
  --on-panel:#EFEFE4; --on-panel-2:#A9A99F;
  --yellow:#F3FF00; --green:#27CF77; --purple:#A62BFF; --red:#E5484D; --amber:#F5A524;
  --green-ink:#0F8A4A; --purple-ink:#8A17E0; --red-ink:#C42B31; --amber-ink:#A86A00;
  --green-tint:#DDF5E7; --purple-tint:#EEDFFF; --yellow-tint:#F8FFB0; --red-tint:#FBE3E3; --amber-tint:#FCEFD6;
  --display:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --sans:'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --mono:'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:10px;
  --hdr-bg:#FFFFFF; --hdr-fg:#0B0B0A; --hdr-fg-2:#5E5E57; --hdr-line:#C9C9BE; --hdr-chip:#EFEFE4; --hdr-track:#E4E4DA; --hdr-seen:#E4E4DA; --hdr-cur-bg:#0B0B0A; --hdr-cur-fg:#F3FF00; --hdr-prog:#0B0B0A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D0D0B; --surface:#171715; --panel:#000000; --panel-2:#1F1F1C;
  --fg:#EFEFE4; --fg-2:#CFCFC4; --muted:#93938A; --line:#2E2E2A; --line-strong:#55554E;
  --green-ink:#3FE08C; --purple-ink:#C27BFF; --red-ink:#FF7A7E; --amber-ink:#FFC35C;
  --green-tint:#10301F; --purple-tint:#2A1340; --yellow-tint:#2B2E00; --red-tint:#3A1517; --amber-tint:#33250A;
  --hdr-bg:#000000; --hdr-fg:#EFEFE4; --hdr-fg-2:#A9A99F; --hdr-line:#4A4A44; --hdr-chip:#1A1A1A; --hdr-track:#2A2A26; --hdr-seen:#2E2E2A; --hdr-cur-bg:#F3FF00; --hdr-cur-fg:#000000; --hdr-prog:#F3FF00; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D0D0B; --surface:#171715; --panel:#000000; --panel-2:#1F1F1C;
  --fg:#EFEFE4; --fg-2:#CFCFC4; --muted:#93938A; --line:#2E2E2A; --line-strong:#55554E;
  --green-ink:#3FE08C; --purple-ink:#C27BFF; --red-ink:#FF7A7E; --amber-ink:#FFC35C;
  --green-tint:#10301F; --purple-tint:#2A1340; --yellow-tint:#2B2E00; --red-tint:#3A1517; --amber-tint:#33250A;
  --hdr-bg:#000000; --hdr-fg:#EFEFE4; --hdr-fg-2:#A9A99F; --hdr-line:#4A4A44; --hdr-chip:#1A1A1A; --hdr-track:#2A2A26; --hdr-seen:#2E2E2A; --hdr-cur-bg:#F3FF00; --hdr-cur-fg:#000000; --hdr-prog:#F3FF00; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr-bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:4px}
b,strong{font-weight:700}
.mark{background:var(--yellow);color:#000;padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--hdr-bg);color:var(--hdr-fg);border-bottom:1px solid var(--hdr-line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:54px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
.brand img{height:20px;width:auto;display:block}
.brand .logo-neg{display:none}
.brand .brand-tag{font-family:var(--mono);font-size:11px;color:var(--hdr-fg-2);letter-spacing:.06em}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .logo-pos{display:none} :root:not([data-theme="light"]) .brand .logo-neg{display:block} }
:root[data-theme="dark"] .brand .logo-pos{display:none}
:root[data-theme="dark"] .brand .logo-neg{display:block}
@media (max-width:860px){ .brand .brand-tag{display:none} }
.route{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.route::-webkit-scrollbar{display:none}
.route button{background:none;border:0;color:var(--hdr-fg-2);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.route button:hover{color:var(--hdr-fg)}
.route button .d{font-family:var(--mono);font-size:10.5px;width:18px;height:18px;border-radius:50%;border:1px solid var(--hdr-line);display:grid;place-items:center;font-weight:500}
.route button.seen .d{background:var(--hdr-seen);border-color:var(--hdr-seen);color:var(--hdr-fg)}
.route button[aria-current="step"]{background:var(--hdr-cur-bg);color:var(--hdr-cur-fg)}
.route button[aria-current="step"] .d{border-color:var(--hdr-cur-fg);background:var(--hdr-cur-fg);color:var(--hdr-cur-bg)}
.theme{display:inline-flex;background:var(--hdr-chip);border:1px solid var(--hdr-line);border-radius:999px;padding:3px;flex:none}
.theme button{background:none;border:0;color:var(--hdr-fg-2);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.theme button[aria-pressed="true"]{background:var(--hdr-fg);color:var(--hdr-bg)}
.progress{height:3px;background:var(--hdr-track);display:flex}
.progress i{flex:1;background:var(--hdr-prog);transform-origin:left;transform:scaleX(0);transition:transform .35s ease}
.progress i.on{transform:scaleX(1)}

main{padding-block:22px 18px}
.stop{display:grid;gap:16px}
.stop>*{min-width:0}
@media (prefers-reduced-motion: no-preference){ .stop{animation:in .35s ease} }
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.beat{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.beat .n{white-space:nowrap;flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--fg);color:var(--bg)}
.beat .h{font-size:12px;color:var(--muted)}
.idea{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;border-bottom:1px dashed var(--line-strong);padding-bottom:16px}
.idea h2{font-family:var(--display);font-size:clamp(26px,3.6vw,38px);line-height:1.06}
.idea p{color:var(--fg-2);max-width:70ch;grid-column:1}
.idea .stopno{grid-column:2;grid-row:1 / span 2;font-family:var(--display);font-size:clamp(46px,7vw,72px);line-height:.8;color:var(--line-strong)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.think{border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.think q{font-family:var(--display);font-size:19px;line-height:1.25;quotes:none}
.think small{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 30px}
.pager button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px}
.pager button.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-family:var(--mono);font-size:12px;color:var(--muted)}
footer{font-size:11.5px;color:var(--muted);padding-block:0 26px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap}
.tpl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--purple-tint);color:var(--purple-ink);border-radius:6px;padding:3px 8px}

/* stop 0 */
.hero{background:var(--panel);color:var(--on-panel);border-radius:var(--r);padding:26px 26px 24px;display:grid;gap:10px}
.status{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-panel-2);border:1px dashed #4A4A44;border-radius:999px;padding:5px 12px;width:max-content;max-width:100%}
.status i{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none}
.hero h1{font-family:var(--display);font-size:clamp(32px,5vw,54px);line-height:1.02;margin-top:6px}
.hero .road{font-family:var(--display);color:var(--yellow);font-size:clamp(20px,2.6vw,28px)}
.hero .sub{color:var(--on-panel-2);max-width:68ch}
.path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:grid;gap:4px;align-content:start;transition:transform .15s,border-color .15s}
.pc:hover{transform:translateY(-2px);border-color:var(--fg)}
.pc .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pc b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.pc span{font-size:12px;color:var(--fg-2)}
.principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.principles .box b{display:block;margin-bottom:4px}

/* stop 1: map */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stg{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:grid;gap:2px;position:relative}
.stg .k{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stg b{font-size:13.5px;line-height:1.2}
.stg .w{font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.stg.dp::after{content:"Decision";position:absolute;top:-9px;right:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:1px 6px;border-radius:999px}
.stg[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stg[aria-pressed="true"] .k,.stg[aria-pressed="true"] .w{color:var(--bg);opacity:.75}
.phases{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.steps{display:grid;gap:6px;counter-reset:s}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);transition:opacity .2s,border-color .2s}
.step::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:11px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center}
.step .t{font-weight:600}
.step .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.step.dim{opacity:.32}
.step.hit{border-color:var(--fg)}
.step.hit::before{background:var(--yellow);border-color:var(--yellow);color:#000}
.yourpart{font-size:13px;color:var(--fg-2)}

/* stop 2: decisions */
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.light{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:700}
.light i{width:18px;height:18px;border-radius:50%;flex:none}
.light[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.outcome{border-radius:var(--r);padding:16px;display:grid;gap:8px}
.outcome.g{background:var(--green-tint)} .outcome.y{background:var(--amber-tint)} .outcome.r{background:var(--red-tint)}
.outcome h3{font-family:var(--display);font-size:22px}
.outcome ol{margin:0;padding-left:20px;display:grid;gap:4px}
.amount{display:grid;gap:10px}
.amount output{font-family:var(--display);font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--purple)}
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verdict .pill{font-weight:700;padding:6px 12px;border-radius:999px}
.pill.fyi{background:var(--green-tint);color:var(--green-ink)}
.pill.appr{background:var(--purple-tint);color:var(--purple-ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.flow span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.flow em{font-style:normal;color:var(--muted)}

/* stop 3: criteria */
.gate{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--bg)}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;font-weight:700;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.crit{display:grid;gap:10px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.cr:last-child{border-bottom:0}
.cr .q{font-size:12.5px;color:var(--muted);grid-column:1}
.cr .sc{grid-row:1 / span 2;grid-column:2}
.dots{display:inline-flex;gap:4px}
.dots button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);font-family:var(--mono);font-weight:500}
.dots button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.total{display:grid;gap:8px;align-content:start}
.total .big{font-family:var(--display);font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.total .big small{font-size:24px;color:var(--muted)}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.meter i{height:10px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--purple)}
.blocked{background:var(--red-tint);color:var(--red-ink);border-radius:8px;padding:10px 12px;font-weight:600;font-size:13px}

/* stop 4: simulator */
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{border:1px dashed var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;text-align:left;font-size:12.5px;max-width:260px}
.preset b{display:block;font-size:12.5px}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.checks{display:grid;gap:12px}
.checks fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0;display:grid;gap:6px;background:var(--surface)}
.checks legend{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.ck input{margin-top:3px;accent-color:var(--fg);flex:none}
.ck.na{opacity:.4}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.row2 select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:5px 8px}
.readout{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 104px);display:grid;gap:10px}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.track div{height:44px;border-radius:6px;background:var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--fg-2);text-align:center;padding:2px;line-height:1.1}
.track div.done{background:var(--green);color:#000}
.track div.now{background:var(--yellow);color:#000;box-shadow:inset 0 0 0 2px #000}
.track div.stopd{background:var(--red);color:#fff}
.where{background:var(--panel);color:var(--on-panel);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.where .eyebrow{color:var(--on-panel-2)}
.where h3{font-family:var(--display);font-size:26px;line-height:1.1}
.next{display:grid;gap:6px}
.next .who{display:flex;flex-wrap:wrap;gap:4px}
.warn{background:var(--amber-tint);color:var(--amber-ink);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600}
.err{background:var(--red-tint);color:var(--red-ink);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600}
.okm{background:var(--green-tint);color:var(--green-ink);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px;flex-wrap:wrap}
.kv b{font-variant-numeric:tabular-nums}
.reset{border:0;background:none;text-decoration:underline;font-size:12px;color:var(--muted);padding:0}

/* stop 5: practice */
.quiz{display:grid;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qdots{display:flex;gap:4px}
.qdots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.qdots i.cur{background:var(--fg)} .qdots i.ok{background:var(--green)} .qdots i.no{background:var(--red)}
.case{background:var(--panel);color:var(--on-panel);border-radius:var(--r);padding:18px;display:grid;gap:6px}
.case .eyebrow{color:var(--on-panel-2)}
.case p{font-family:var(--display);font-size:clamp(19px,2.2vw,24px);line-height:1.25}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px;text-align:left;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:var(--mono);font-size:11px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green-ink);background:var(--green-tint)}
.opt.wrong{border-color:var(--red-ink);background:var(--red-tint)}
.fb{border-radius:8px;padding:12px;font-size:13.5px;display:grid;gap:4px}
.fb.ok{background:var(--green-tint)} .fb.no{background:var(--red-tint)}
.qnav{display:flex;justify-content:flex-end;gap:8px}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line-strong)}
.score{text-align:center;display:grid;gap:8px;justify-items:center;padding:20px}
.score .big{font-family:var(--display);font-size:72px;line-height:.9}

/* stop 6: keep */
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet .box h3{font-family:var(--display);font-size:20px;margin-bottom:6px}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line-strong)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}


/* simple map */
.simple{display:grid;gap:14px}
.simple-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.line{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative;gap:4px}
.line::before{content:"";position:absolute;left:7%;right:7%;top:21px;height:2px;background:var(--line-strong)}
.nd{background:none;border:0;display:grid;justify-items:center;gap:6px;position:relative;padding:0 2px;text-align:center;min-width:0}
.nd .c{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-size:12px;transition:background .2s,border-color .2s,transform .2s}
.nd.dec .c{width:32px;height:32px;margin:6px;border-radius:6px;transform:rotate(45deg)}
.nd.dec .c span{transform:rotate(-45deg);font-size:11px}
.nd .txt{display:grid;gap:1px;min-width:0}
.nd .lb{font-size:12.5px;font-weight:700;line-height:1.2}
.nd .wk{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.nd.past .c{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nd[aria-pressed="true"] .c{background:var(--yellow);color:#000;border-color:#000}
.nd:hover .c{border-color:var(--fg)}
.cap{background:var(--panel);color:var(--on-panel);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;min-height:92px}
.cap .eyebrow{color:var(--on-panel-2)}
.cap b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.cap .tags{display:flex;flex-wrap:wrap;gap:6px}
.cap .tags span{font-family:var(--mono);font-size:10.5px;border:1px solid #4A4A44;border-radius:999px;padding:2px 8px;color:var(--on-panel-2)}
@media (max-width:640px){
  .line{grid-template-columns:minmax(0,1fr);gap:8px}
  .line::before{left:21px;right:auto;top:12px;bottom:12px;width:2px;height:auto}
  .nd{grid-template-columns:44px minmax(0,1fr);justify-items:start;align-items:center;text-align:left;gap:12px}
}
@media (max-width:520px){ .theme .tl{display:none} }

/* ---------- process map (board layout, horizontal) ---------- */
.pmap-box{display:grid;gap:14px}
.pmap-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pmap-head h3{font-family:var(--display);font-size:24px;line-height:1.1}
.pmap{overflow-x:auto;padding:30px 4px 8px;scrollbar-width:thin}
.pmap-row{position:relative;display:grid;grid-template-columns:repeat(7,minmax(122px,1fr));gap:8px;min-width:920px;align-items:stretch}
.pmap-row::before{content:"";position:absolute;left:-4px;right:-4px;top:14%;bottom:14%;background:var(--green-tint);clip-path:polygon(0 0,97.5% 0,100% 50%,97.5% 100%,0 100%);z-index:0}
.ph{position:relative;z-index:1;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:12px 11px;display:grid;gap:5px;align-content:start;min-height:158px;transition:transform .15s,box-shadow .15s}
.ph .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ph b{font-size:14px;line-height:1.15}
.ph .s{font-size:11.5px;color:var(--fg-2);line-height:1.35}
.ph .w{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:auto}
.ph.dp{background:var(--panel);color:var(--on-panel);border-color:var(--panel)}
.ph.dp .n,.ph.dp .s,.ph.dp .w{color:var(--on-panel-2)}
.ph .dpt{position:absolute;top:-24px;left:0;font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--panel);color:var(--yellow);padding:3px 8px;border-radius:4px;white-space:nowrap}
.ph:hover{transform:translateY(-2px)}
.ph[aria-pressed="true"]{box-shadow:0 0 0 3px var(--yellow),0 10px 22px rgba(0,0,0,.18);transform:translateY(-4px)}
.ph.past .n::after{content:" ✓";color:var(--green-ink)}
.pstep{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pctr{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.pctr b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--fg)}
.pbar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:180px}
.pbar i{height:6px;border-radius:3px;background:var(--line)}
.pbar i.on{background:var(--fg)}
.pbtns{display:flex;gap:6px}
.pbtns button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px}
.pbtns button.play{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pbtns button:disabled{opacity:.35;cursor:default}
.pdet{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.pdet h4{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:2px 0 6px}
.pdet .lead{color:var(--fg-2);font-size:14px;margin-bottom:10px}
.pdet ol{margin:0;padding-left:20px;display:grid;gap:5px;font-size:13.5px}
.pside{display:grid;gap:12px;align-content:start;border-left:1px dashed var(--line-strong);padding-left:14px}
.pside .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.who{display:flex;flex-wrap:wrap;gap:5px}
.who .team{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fg);color:var(--bg)}
.who .ext{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px dashed var(--line-strong);color:var(--fg-2)}
.pdec{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--yellow-tint);color:var(--fg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .sw{width:22px;height:12px;border-radius:999px;display:inline-block}
@media (max-width:760px){ .pdet{grid-template-columns:minmax(0,1fr)} .pside{border-left:0;padding-left:0;border-top:1px dashed var(--line-strong);padding-top:12px} .pbar{width:120px} }

/* two-row header: brand + actions on top, every stop visible below */
.top .wrap{flex-wrap:wrap;row-gap:2px}
.top .brand{order:1;margin-right:auto}
.top .sharebtn{order:2}
.top .theme{order:3}
.top .route{order:4;flex:1 0 100%;padding-bottom:6px;flex-wrap:wrap;overflow:visible;row-gap:2px}

/* learning scaffolding */
.objectives{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.objectives ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;counter-reset:h}
.howto div{border-top:3px solid var(--fg);padding-top:8px;font-size:12.5px;color:var(--fg-2)}
.howto div b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}
.deeper{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r);padding:14px 16px;background:var(--bg)}
.deeper .ic{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:#000;display:grid;place-items:center;font-size:18px}
.deeper p{font-size:13.5px;color:var(--fg-2)}
.deeper a{color:var(--fg);font-weight:700;text-underline-offset:3px}
.remember{background:var(--yellow-tint);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.remember b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.optional{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--line-strong);border-radius:999px;padding:2px 8px;color:var(--muted)}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;font-size:13px}
.gloss div{padding:6px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px}
.done-meter{display:flex;gap:4px;margin-top:6px}
.done-meter i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.done-meter i.on{background:var(--green)}
.cta{background:var(--panel);color:var(--on-panel);border-radius:var(--r);padding:18px;display:grid;gap:8px}
.cta h3{font-family:var(--display);font-size:24px}
.cta p{color:var(--on-panel-2);font-size:13.5px}
.cta .links{display:flex;gap:8px;flex-wrap:wrap}
.cta a{color:#000;background:var(--on-panel);border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;text-decoration:none}
.cta a.g{background:transparent;color:var(--on-panel);border:1px solid #55554E}
.simhow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.simhow div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--fg-2)}
.simhow b{color:var(--fg);display:block}
.track{grid-template-columns:repeat(7,minmax(0,1fr))!important}
.track div{font-size:9.5px!important;height:48px!important}
@media (max-width:760px){ .objectives,.howto,.gloss,.simhow{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .path{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.sim,.sheet,.principles{grid-template-columns:minmax(0,1fr)}
  .readout{position:static}
}
@media (max-width:520px){
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lights{grid-template-columns:minmax(0,1fr)}
  .idea{grid-template-columns:minmax(0,1fr)}
  .idea .stopno{display:none}
  .hero{padding:20px}
  .brand img{height:16px}
  .theme button{padding:5px 8px}
}
</style>

</head>

let phI = 0, phTimer = null;
function drawPhase(){

  const pn = document.getElementById('pnum'); if(pn) pn.textContent = phI+1;
  document.getElementById('pprev').disabled = phI===0; document.getElementById('pnext').disabled = phI===PH.length-1;
  document.getElementById('pdet').innerHTML = `<div><span class="eyebrow">Phase ${String(phI+1).padStart(2,'0')}${p.dp?' · decision point '+p.dp:''}</span><h4>${p.name}</h4><p class="lead">${p.lead}</p><ol>${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>${p.dec?`<div class="pdec" style="margin-top:12px"><b>Decision:</b> ${p.dec}</div>`:''}</div>

    ${p.ext.length?`<div><div class="k">Outside the team</div><div class="who">${p.ext.map(t=>`<span class="ext">${t}</span>`).join('')}</div></div>`:''}
    <div><div class="k">Template</div>${p.tpl?`<span class="tpl">▤ ${p.tpl}</span>`:'<span class="muted" style="font-size:13px">None at this phase</span>'}</div>
    <div><div class="k">Typical time</div><span style="font-size:13px">${p.time}</span></div></div>`;
  const btn = document.querySelector('#pmap .ph[aria-pressed="true"]'); if(btn && btn.scrollIntoView) btn.scrollIntoView({block:'nearest',inline:'nearest'});
}
function stopPlay(){ if(phTimer){ clearInterval(phTimer); phTimer=null; } const b=document.getElementById('pplay'); if(b) b.textContent='▶ Play the process'; }
function bindPhases(){
  document.querySelectorAll('#pmap .ph').forEach(b=>b.addEventListener('click',()=>{ stopPlay(); phI=Number(b.dataset.p); drawPhase(); }));
  document.getElementById('pprev').addEventListener('click',()=>{ stopPlay(); if(phI>0){ phI--; drawPhase(); } });
  document.getElementById('pnext').addEventListener('click',()=>{ stopPlay(); if(phI<PH.length-1){ phI++; drawPhase(); } });
  document.getElementById('pplay').addEventListener('click',()=>{
    if(phTimer){ stopPlay(); return; }
    if(phI>=PH.length-1) phI=0; else if(phI>0) phI++;
    drawPhase(); document.getElementById('pplay').textContent='❚❚ Pause';
    phTimer=setInterval(()=>{ if(!document.getElementById('pmap')){ stopPlay(); return; } if(phI>=PH.length-1){ stopPlay(); return; } phI++; drawPhase(); }, 4000);
  });
  drawPhase();
}

    head = `<span class="eyebrow">Now in phase ${g.k}</span><h3>${g.name}</h3>`;
    body = `<div class="next"><b>Next step</b><span>${txt}</span><div class="who">${nextStep.who.map(w=>`<span class="tag" title="${ROLES[w]}">${ROLES[w]}</span>`).join('')}${nextStep.tpl?`<span class="tpl">▤ ${nextStep.tpl}</span>`:''}</div></div>`;
    if(nextStep.id==='crm' && S.sh24) body += `<div class="okm">Ready for the CRM: One-Pager shared, two reviewers assigned.</div>`;
    if(S.crm==='yellow' && nextStep.id==='yv') body += `<div class="warn">Yellow light: the opportunity cannot move to the memo until the reviewers and the CEO validate the revised One-Pager.</div>`;
  } else {
    // implementation tracking
    const due = S.cadence * (S.reports + 1);
    const late = S.months > due;
    head = `<span class="eyebrow">Phase 07 · in partnership</span><h3>Onboarding + support</h3>`;
    body = `<div class="next"><b>Reporting</b><span>The organization reports its own progress with the Follow-up Report, every ${S.cadence} months, plus a final report.</span><div class="who"><span class="tag">ORG</span><span class="tag">AL</span><span class="tpl">▤ Follow-up Report</span></div></div>
      <div class="kv"><span>Next report due</span><b>Month ${due}</b></div>
      ${late?`<div class="warn">Report ${S.reports+1} is ${S.months-due} month${S.months-due===1?'':'s'} overdue. The Area Lead requests it.</div>`:`<div class="okm">Reporting is up to date. ${due-S.months===0?'A report is due this month.':`Next one in ${due-S.months} month${due-S.months===1?'':'s'}.`}</div>`}`;
  }
  // time to signature
  let wk = 0;
  if(!ended && nextStep && nextStep.st<4){ for(let i=nextStep.st;i<4;i++) wk += STAGES[i].weeks; }
  const doneN = list.filter(isDone).length;
  $('#readout').innerHTML = `<div class="track">${track}</div>
    <div class="where">${head}</div>
    <div class="box" style="display:grid;gap:10px">${body}
      ${!ended && nextStep && nextStep.st<4?`<div class="kv"><span>Typical time to signed agreement</span><b>up to ~${wk} weeks</b></div>`:''}
      <div class="kv"><span>Steps completed</span><b>${doneN} / ${list.length}</b></div>
      <div class="kv"><span>Approval route</span><b>${S.amount>=200000?'CEO + Principals approve':'CEO approves · Principals FYI'}</b></div>
    </div>
    ${warnings.map(w=>`<div class="err">${esc(w)}</div>`).join('')}`;
}
function bindSim(){
  document.querySelectorAll('#checks input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{ S[c.dataset.k]=c.checked; drawSim(); }));
  $('#crm-sel').addEventListener('change',e=>{ S.crm=e.target.value; if(S.crm!=='yellow') S.yv=false; drawSim(); });
  $('#sim-amt').addEventListener('change',e=>{ S.amount=Number(e.target.value); drawSim(); });
  $('#sim-cad').addEventListener('change',e=>{ S.cadence=Number(e.target.value); drawSim(); });
  $('#sim-mon').addEventListener('change',e=>{ S.months=Number(e.target.value); drawSim(); });
  $('#sim-rep').addEventListener('change',e=>{ S.reports=Number(e.target.value); drawSim(); });
  document.querySelectorAll('#presets .preset').forEach(b=>b.addEventListener('click',()=>{ S=Object.assign(blank(), PRESETS[Number(b.dataset.p)].s); drawSim(); }));
  $('#sim-reset').addEventListener('click',()=>{ S=blank(); drawSim(); });
  drawSim();
}

/* stop 5: practice */
let qi = 0, answers = [];
function renderPractice(){
  return `${idea(5,'Optional','Practice','Eight situations you will meet','Test yourself if you want to. Choose what you would do: each answer explains the rule behind it. You can skip straight to the cheat sheet.')}<div class="quiz" id="quiz"></div>`;
}
function drawQuiz(){
  const Q = $('#quiz');
  const dots = `<div class="qdots">${CASES.map((_,i)=>`<i class="${answers[i]===undefined?(i===qi?'cur':''):(answers[i]===CASES[i].a?'ok':'no')}"></i>`).join('')}</div>`;
  if(qi>=CASES.length){
    const right = answers.filter((a,i)=>a===CASES[i].a).length;
    store.set('quiz', right);
    Q.innerHTML = `<div class="qhead"><span class="eyebrow">Done</span>${dots}</div><div class="box score"><span class="eyebrow">Your score</span><div class="big">${right}/${CASES.length}</div><p class="muted">${right===CASES.length?'You know the process. Use the simulator with your real opportunities.':'Review the cases you missed, then try again.'}</p><button type="button" class="btn" id="qagain">Try again</button></div>`;
    $('#qagain').addEventListener('click',()=>{ qi=0; answers=[]; drawQuiz(); });
    return;
  }
  const c = CASES[qi], a = answers[qi];
  Q.innerHTML = `<div class="qhead"><span class="eyebrow">Case ${qi+1} of ${CASES.length}</span>${dots}</div>
    <div class="case"><span class="eyebrow">The situation</span><p>${c.s}</p></div>
    <div class="opts">${c.o.map((o,i)=>{ let cls=''; if(a!==undefined){ if(i===c.a) cls='right'; else if(i===a) cls='wrong'; } return `<button type="button" class="opt ${cls}" data-i="${i}" ${a!==undefined?'disabled':''}><span class="l">${'ABC'[i]}</span><span>${o}</span></button>`; }).join('')}</div>
    ${a!==undefined?`<div class="fb ${a===c.a?'ok':'no'}"><b>${a===c.a?'Right.':'Not quite.'}</b><span>${c.why}</span></div><div class="qnav"><button type="button" class="btn" id="qnext">${qi===CASES.length-1?'See my score':'Next case →'}</button></div>`:''}`;
  Q.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{ answers[qi]=Number(b.dataset.i); drawQuiz(); }));
  const n = $('#qnext'); if(n) n.addEventListener('click',()=>{ qi++; drawQuiz(); });
}

/* stop 6: keep */
const GLOSS = [['AL','Area Lead: owns each opportunity from screening to partnership'],['AT','Area Team: prepares the documents with the Area Lead'],['Reviewers','Two people who challenge the proposal before the CRM and the memo'],['CRM','Concept Review Meeting: decision point 1'],['KMD','Knowledge Management Director: supports evidence and measurement'],['AD','Administrative Director: legal documents and agreements'],['Principals','The founders. Informed below US$200k, approve from US$200k'],['Trust','Approves the grant and signs the grant receipt letter'],['One-Pager','ver+’s own one-page view of the opportunity, for the CRM'],['Additionality','Whether our absence would change the outcome']];
function renderKeep(){
  const visited = STOPS.filter((_,i)=>seen.has(i)).length;
  return `${idea(6,'Keep','Your cheat sheet','Everything on one screen','Come back here when you are in the middle of a real process.')}
  <div class="box"><span class="eyebrow">Your progress</span><div style="font-size:13.5px;margin-top:4px">You have visited <b>${visited} of ${STOPS.length}</b> stops.</div><div class="done-meter">${STOPS.map((_,i)=>`<i class="${seen.has(i)?'on':''}"></i>`).join('')}</div></div>
  <div class="sheet">
    <div class="box"><h3>The seven phases</h3><ul>${PH.map((p,i)=>`<li><b>${String(i+1).padStart(2,'0')} ${p.name}</b>${p.dp?' · decision point '+p.dp:''} · ${p.time}</li>`).join('')}</ul></div>
    <div class="box"><h3>The two decisions</h3><ul><li><b>CRM:</b> green advances, yellow adjusts and is validated by reviewers + CEO, red ends and is explained.</li><li><b>Investment Committee:</b> CEO approves. Principals informed below US$200k, approve from US$200k.</li><li>Share the One-Pager at least 24 hours before the CRM.</li></ul></div>
    <div class="box"><h3>The criteria</h3><ul><li><b>Strategic fit:</b> gate, pass/fail, never scored.</li><li>Then 0–2 each, out of 10: additionality, solution strength, team strength, non-linear scale potential, impact potential.</li></ul></div>
    <div class="box"><h3>The partnership</h3><ul><li>OKRs written with pencil.</li><li>We usually take board seats.</li><li>Active support on strategy, MEL and product mindset.</li><li>Keep outreach, measured improvement and attribution distinct.</li></ul></div>
  </div>
  <div class="box tw"><table class="t"><thead><tr><th>Template</th><th>Who fills it</th><th>When</th></tr></thead><tbody>
    <tr><td><span class="tpl">▤ Organization Concept Note</span></td><td>Organization</td><td>Screening</td></tr>
    <tr><td><span class="tpl">▤ Investment One-Pager</span></td><td>Area team</td><td>Concept Review</td></tr>
    <tr><td><span class="tpl">▤ Full Investment Memo</span></td><td>Area team</td><td>Investment Due Diligence</td></tr>
    <tr><td><span class="tpl">▤ Partnership Agreement 5.0</span></td><td>AL + AD + Organization</td><td>Legal Due Diligence</td></tr>
    <tr><td><span class="tpl">▤ Follow-up Report</span></td><td>Organization</td><td>Every 6 or 12 months, and at close</td></tr>
  </tbody></table></div>
  <div class="box"><span class="eyebrow">Glossary</span><div class="gloss" style="margin-top:8px">${GLOSS.map(g=>`<div><b>${g[0]}</b>${g[1]}</div>`).join('')}</div></div>
  <div class="cta"><span class="eyebrow" style="color:var(--yellow)">Now read the full process</span><h3>This guide is the introduction. The documents are the reference.</h3><p>The Notion page has every phase in detail, the FAQ answers the questions people ask most, and the Strategy Library holds the templates, the flowchart and the complete process guide.</p>
    <div class="links"><a href="https://app.notion.com/p/405d3fa668bb812bad05f32dd86413e4" target="_blank" rel="noopener">Investment Process in Notion</a><a class="g" href="https://app.notion.com/p/405d3fa668bb81be8e5fc32e77593e3a" target="_blank" rel="noopener">FAQ</a><a class="g" href="https://app.notion.com/p/294c630dfead474ab2229082a0215138" target="_blank" rel="noopener">Strategy Library</a></div></div>
  <div class="think"><span class="eyebrow">Reflect</span><q>Where is your opportunity today, and who owns the next step?</q></div>`;
}

const DEEPER = {
  map:['Read every phase in full, step by step, on the Investment Process page in Notion.', 'https://app.notion.com/p/405d3fa668bb812bad05f32dd86413e4', 'Open the Notion summary'],
  decide:['The FAQ answers the questions people ask most about the CRM and approvals.', 'https://app.notion.com/p/405d3fa668bb81be8e5fc32e77593e3a', 'Read the FAQ'],
  score:['The full criteria table, with what each score means, is on the Investment Process page.', 'https://app.notion.com/p/405d3fa668bb812bad05f32dd86413e4', 'See the criteria in Notion'],
  simulate:['All templates, the flowchart and the full process guide are in the Strategy Library.', 'https://app.notion.com/p/294c630dfead474ab2229082a0215138', 'Open the Strategy Library'],
  practice:['Missed a case? The FAQ explains each rule in a sentence or two.', 'https://app.notion.com/p/405d3fa668bb81be8e5fc32e77593e3a', 'Read the FAQ']
};
function deeper(id){ const d = DEEPER[id]; if(!d) return ''; return `<div class="deeper"><span class="ic" aria-hidden="true">📖</span><p><b>Go deeper.</b> ${d[0]} <a href="${d[1]}" target="_blank" rel="noopener">${d[2]} →</a></p></div>`; }
const RENDER = [renderStart, renderMap, renderDecide, renderScore, renderSim, renderPractice, renderKeep];
const BIND = [()=>{ document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.go)))); }, bindMap, bindDecide, bindScore, bindSim, drawQuiz, ()=>{}];

/* ---------------- shell ---------------- */
const route = $('#route'), prog = $('#progress');
route.innerHTML = STOPS.map((s,i)=>`<button type="button" data-i="${i}"><span class="d">${i}</span>${s.label}</button>`).join('');
prog.innerHTML = STOPS.map(()=>'<i></i>').join('');
route.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.i))));
function go(i){
  if(typeof stopPlay==='function') stopPlay();
  cur = Math.max(0, Math.min(STOPS.length-1, i));
  seen.add(cur); store.set('seen', [...seen]); store.set('cur', cur);
  const main = $('#main');
  main.innerHTML = `<section class="stop" id="${STOPS[cur].id}">${RENDER[cur]()}${deeper(STOPS[cur].id)}</section>`;
  BIND[cur]();
  route.querySelectorAll('button').forEach((b,j)=>{ b.classList.toggle('seen', seen.has(j)); if(j===cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  const active = route.querySelector('[aria-current]'); if(active && active.scrollIntoView) active.scrollIntoView({block:'nearest', inline:'center'});
  prog.querySelectorAll('i').forEach((el,j)=>el.classList.toggle('on', j<=cur));
  $('#prev').disabled = cur===0; $('#next').disabled = cur===STOPS.length-1;
  $('#count').textContent = `${cur+1} / ${STOPS.length}`;
  try{ history.replaceState(null,'','#'+STOPS[cur].id); }catch(e){}
  window.scrollTo({top:0});
}
$('#prev').addEventListener('click',()=>go(cur-1));
$('#next').addEventListener('click',()=>go(cur+1));

/* theme */
const root = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: dark)');
function paintTheme(){ const t = root.getAttribute('data-theme'); const dark = t ? t==='dark' : mq.matches; $('#th-light').setAttribute('aria-pressed', String(!dark)); $('#th-dark').setAttribute('aria-pressed', String(dark)); }
function setTheme(t){ if(t) root.setAttribute('data-theme', t); paintTheme(); }
$('#th-light').addEventListener('click',()=>{ store.set('theme','light'); setTheme('light'); });
$('#th-dark').addEventListener('click',()=>{ store.set('theme','dark'); setTheme('dark'); });
if(mq.addEventListener) mq.addEventListener('change', paintTheme);
setTheme(store.get('theme', null));

const fromHash = STOPS.findIndex(s=>'#'+s.id===location.hash);
go(fromHash>-1 ? fromHash : 0);
})();
</script>
