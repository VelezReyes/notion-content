<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupido+ · Amig@ secret@ VélezReyes+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CUPIDO+ · Sistema visual
   Marca VélezReyes+ desviada al mes del amor y la amistad.
   Mundo: correspondencia anónima — sobres, sellos de lacre,
   matasellos y un expediente de pistas.
   ============================================================ */
:root{
  /* Superficies */
  --night:#180A2B;        /* berenjena profunda, lienzo */
  --night-2:#22103C;      /* superficie elevada */
  --night-3:#2E1750;      /* borde vivo */
  --paper:#F5EFE7;        /* papel de sobre */
  --paper-2:#EAE0D4;      /* papel en sombra */

  /* Marca */
  --purple:#A62BFF;
  --purple-lt:#C97AFF;
  --purple-dk:#6F15C4;
  --acid:#F3FF00;
  --mint:#27CF77;

  /* Estacional */
  --magenta:#FF3D8A;
  --magenta-dk:#C41F63;

  /* Texto */
  --ink:#14060F;
  --ink-soft:#4A3D46;
  --on-night:#EFE6F7;
  --on-night-soft:#A895BE;
  --on-night-faint:#6E5A88;

  --line:rgba(239,230,247,.12);
  --line-2:rgba(239,230,247,.22);
  --line-paper:rgba(20,6,15,.14);

  --wax:radial-gradient(circle at 34% 30%, #FF6FA8 0%, var(--magenta) 38%, var(--magenta-dk) 76%, #8E1246 100%);
  --glow:0 0 0 1px rgba(166,43,255,.35), 0 12px 40px rgba(166,43,255,.22);

  --serif:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --type:'Courier Prime', 'Courier New', ui-monospace, monospace;

  --r:16px; --r-sm:10px;
  --maxw:1140px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--night);
  color:var(--on-night);
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
/* Atmósfera: dos halos fijos, muy quietos */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(50rem 32rem at 12% -8%, rgba(166,43,255,.30), transparent 62%),
    radial-gradient(44rem 30rem at 96% 8%, rgba(255,61,138,.20), transparent 60%);
}
#app{position:relative; z-index:1}
button{font-family:inherit; cursor:pointer}
input,textarea,select{font-family:inherit; font-size:1rem}
a{color:var(--purple-lt)}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(1rem,4vw,2.5rem)}
.hidden{display:none !important}

/* ── Tipografía ─────────────────────────────────────────── */
h1,h2,h3{font-family:var(--serif); font-weight:400; line-height:1.08; margin:0}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
h3{font-size:1.25rem}
.eyebrow{
  font-family:var(--type); font-size:.7rem; font-weight:700;
  letter-spacing:.22em; text-transform:uppercase; color:var(--purple-lt);
}
.lede{color:var(--on-night-soft); font-size:1.02rem; max-width:56ch}
em.i{font-family:var(--serif); font-style:italic}

/* ── Barra superior ─────────────────────────────────────── */
.topbar{
  position:sticky; top:0; z-index:80;
  background:rgba(24,10,43,.86); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:var(--maxw); margin:0 auto; padding:.7rem clamp(1rem,4vw,2.5rem);
  display:flex; align-items:center; gap:1rem}
.brand{display:flex; align-items:baseline; font-family:var(--serif); font-size:1.35rem; letter-spacing:.01em}
.brand .plus{color:var(--magenta)}
.spacer{flex:1}
.langs{display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:99px; padding:3px}
.langs button{
  border:0; background:transparent; color:var(--on-night-soft);
  font-family:var(--type); font-size:.7rem; font-weight:700; letter-spacing:.1em;
  padding:.32rem .6rem; border-radius:99px;
}
.langs button[aria-pressed="true"]{background:var(--purple); color:#fff}
.userchip{display:flex; align-items:center; gap:.5rem; background:rgba(255,255,255,.06);
  border:1px solid var(--line); border-radius:99px; padding:.25rem .8rem .25rem .25rem; font-size:.82rem; font-weight:600}
.userchip img{width:26px; height:26px; border-radius:50%; object-fit:cover; background:var(--night-3)}
.linkbtn{background:none; border:0; color:var(--on-night-faint); font-size:.75rem; text-decoration:underline; padding:0}
.linkbtn:hover{color:var(--magenta)}

/* ── Navegación de secciones ────────────────────────────── */
.tabs{display:flex; gap:.35rem; overflow-x:auto; padding:.9rem 0 0; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line); background:transparent; color:var(--on-night-soft);
  border-radius:99px; padding:.45rem 1rem; font-size:.82rem; font-weight:600; white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--paper); color:var(--ink); border-color:var(--paper)}
.tab.admin[aria-selected="true"]{background:var(--acid); color:var(--ink); border-color:var(--acid)}

/* ── Sello de lacre (elemento firma) ────────────────────── */
.seal{
  width:var(--sz,84px); height:var(--sz,84px); border-radius:50%;
  background:var(--wax); border:0; position:relative; flex:none;
  display:grid; place-items:center; color:#fff;
  font-family:var(--serif); font-size:calc(var(--sz,84px) * .46); line-height:1;
  box-shadow:inset 0 2px 6px rgba(255,255,255,.42), inset 0 -6px 14px rgba(0,0,0,.42), 0 8px 22px rgba(196,31,99,.4);
  transition:transform .18s cubic-bezier(.34,1.6,.5,1), box-shadow .18s;
}
.seal::before{
  content:''; position:absolute; inset:-5px; border-radius:50%;
  background:var(--wax); opacity:.55; z-index:-1;
  clip-path:polygon(50% 0%,66% 6%,80% 2%,88% 16%,99% 26%,95% 42%,100% 56%,90% 68%,90% 84%,74% 88%,62% 98%,48% 93%,34% 99%,22% 89%,7% 85%,5% 69%,-2% 55%,4% 41%,0% 25%,13% 17%,20% 3%,36% 7%);
}
.seal:hover{transform:scale(1.05) rotate(-3deg)}
.seal:active{transform:scale(.96)}
.seal:disabled{filter:grayscale(.7) brightness(.6); cursor:not-allowed; transform:none}

/* ── Sobres ─────────────────────────────────────────────── */
.envelope{
  background:linear-gradient(168deg, var(--paper) 0%, var(--paper-2) 100%);
  color:var(--ink); border-radius:var(--r); position:relative;
  box-shadow:0 18px 44px rgba(0,0,0,.38);
  overflow:hidden;
}
.envelope .flap{
  position:absolute; inset:0 0 auto 0; height:56%;
  background:linear-gradient(180deg,#EFE5D8,#E1D4C3);
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center; transition:transform .62s cubic-bezier(.6,-0.28,.36,1.3);
  z-index:3; border-bottom:1px solid rgba(20,6,15,.08);
}
.envelope.open .flap{transform:rotateX(-172deg)}
.envelope .flap-seal{
  position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); z-index:4;
  transition:opacity .3s .1s;
}
.envelope.open .flap-seal{opacity:0; pointer-events:none}
.envelope .inner{position:relative; z-index:2; padding:1.4rem 1.5rem 1.5rem}
.envelope.sealed .inner{visibility:hidden}
.share-row{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1.2rem;
  padding-top:1rem; border-top:1px dashed var(--line-paper)}
.share-row .btn{background:rgba(20,6,15,.06); border-color:var(--line-paper); color:var(--ink-soft)}
.share-row .btn:hover{background:rgba(20,6,15,.13); color:var(--ink)}
.env-shut{
  position:absolute; inset:0; z-index:5; display:grid; place-items:center; gap:.8rem;
  align-content:center; background:transparent; border:0; width:100%; color:var(--ink-soft);
  font-family:var(--type); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
}
.envelope.open .env-shut{display:none}

/* ── Cada ciclo, su propia papelería ───────────────────────
   Papel, lacre y motivo distintos, para que el buzón no sea
   tres veces el mismo sobre. */
.envelope{transform:rotate(var(--tilt,0deg))}
.envelope.c1{--paper-a:#F6F0E6; --paper-b:#E7DCCB; --wax:radial-gradient(circle at 34% 30%,#FF6FA8 0%,#FF3D8A 38%,#C41F63 76%,#8E1246 100%)}
.envelope.c2{--paper-a:#F3EAF3; --paper-b:#E1D2E6; --wax:radial-gradient(circle at 34% 30%,#D89BFF 0%,#A62BFF 38%,#6F15C4 76%,#43097C 100%)}
.envelope.c3{--paper-a:#EDF2E7; --paper-b:#DBE4D2; --wax:radial-gradient(circle at 34% 30%,#8FE9BC 0%,#27CF77 38%,#1A9054 76%,#0E5B34 100%)}
.envelope.c1,.envelope.c2,.envelope.c3{background:linear-gradient(168deg,var(--paper-a),var(--paper-b))}
.envelope.c1 .flap,.envelope.c2 .flap,.envelope.c3 .flap{
  background:linear-gradient(180deg,var(--paper-a),color-mix(in srgb,var(--paper-b) 82%,#000 4%))}

/* c1 · La carta — franja de correo aéreo en el borde izquierdo */
.envelope.c1::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:9px; z-index:6;
  background:repeating-linear-gradient(135deg,#FF3D8A 0 7px,transparent 7px 14px,#A62BFF 14px 21px,transparent 21px 28px);
  opacity:.85;
}
/* c2 · La banda sonora — onda al pie */
.envelope.c2::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:22px; z-index:1; opacity:.5;
  background:repeating-linear-gradient(90deg,#A62BFF 0 2px,transparent 2px 9px);
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 9px);
  clip-path:polygon(0 60%,4% 20%,8% 75%,12% 35%,16% 90%,20% 10%,24% 70%,28% 30%,32% 85%,36% 45%,40% 15%,44% 80%,48% 25%,52% 65%,56% 35%,60% 90%,64% 20%,68% 75%,72% 40%,76% 85%,80% 30%,84% 70%,88% 15%,92% 80%,96% 45%,100% 60%,100% 100%,0 100%);
}
/* c3 · El estante — renglones de página */
.envelope.c3 .inner{
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(20,6,15,.07) 27px 28px);
  background-position:0 1.4rem;
}

/* ── Tarjetas oscuras ───────────────────────────────────── */
.card{
  background:linear-gradient(180deg, var(--night-2), rgba(34,16,60,.6));
  border:1px solid var(--line); border-radius:var(--r); padding:1.4rem 1.5rem;
}
.intro-backdrop{
  position:fixed; inset:0; z-index:200; display:grid; place-items:center;
  padding:1.2rem; background:rgba(10,4,20,.72); backdrop-filter:blur(3px);
}
.intro-card{
  max-width:420px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.intro-card h3{margin:.2rem 0 .7rem}
.intro-card p{margin:0 0 1.3rem; color:var(--on-night-soft); line-height:1.55}
.loading-wrap{
  min-height:100vh; display:grid; place-items:center; gap:1rem; text-align:center;
}
.spinner{
  width:34px; height:34px; border-radius:50%;
  border:3px solid var(--line-2); border-top-color:var(--purple);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.card.accent{border-color:rgba(166,43,255,.4); box-shadow:var(--glow)}
.grid{display:grid; gap:1.1rem}
@media(min-width:860px){ .grid.two{grid-template-columns:1fr 1fr} .grid.side{grid-template-columns:1.15fr .85fr} }

/* ── Matasellos ─────────────────────────────────────────── */
.postmark{
  font-family:var(--type); font-size:.62rem; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--on-night-soft);
  border:1.5px dashed var(--line-2); border-radius:99px; padding:.3rem .8rem;
  display:inline-flex; align-items:center; gap:.4rem;
}
.postmark.on{color:var(--acid); border-color:rgba(243,255,0,.5)}
.postmark.done{color:var(--mint); border-color:rgba(39,207,119,.5); border-style:solid}
.postmark.paper{color:var(--ink-soft); border-color:var(--line-paper)}

/* ── Formularios ────────────────────────────────────────── */
label.fld{display:block; margin-bottom:1rem}
label.fld > span{display:block; font-size:.74rem; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--on-night-soft); margin-bottom:.4rem}
.inp, textarea.inp, select.inp{
  width:100%; background:rgba(0,0,0,.28); border:1px solid var(--line-2);
  color:var(--on-night); border-radius:var(--r-sm); padding:.7rem .85rem; outline:none;
}
.inp:focus, textarea.inp:focus, select.inp:focus{border-color:var(--purple); box-shadow:0 0 0 3px rgba(166,43,255,.2)}
textarea.inp{min-height:120px; resize:vertical; line-height:1.6}
.hint{font-size:.78rem; color:var(--on-night-faint); margin-top:.35rem; line-height:1.5}
.steps{display:grid; gap:1.5rem}
.step{display:flex; gap:1.2rem; align-items:flex-start}
.step-ico{position:relative; flex:none; width:56px; height:56px; border-radius:14px;
  display:grid; place-items:center; color:var(--purple-lt);
  background:rgba(166,43,255,.13); border:1px solid rgba(166,43,255,.3)}
.step-ico svg{width:26px; height:26px}
.step-n{position:absolute; top:-8px; right:-8px; font-family:var(--type); font-size:.62rem;
  font-weight:700; background:var(--magenta); color:#fff; border-radius:99px; padding:.15rem .4rem}
.golden{margin:0; padding:0; list-style:none; counter-reset:g; display:grid; gap:.8rem}
.golden li{counter-increment:g; display:flex; gap:.8rem; font-size:.94rem; line-height:1.55; color:var(--on-night-soft)}
.golden li::before{content:counter(g); font-family:var(--type); font-weight:700; font-size:.72rem;
  color:var(--acid); border:1px solid rgba(243,255,0,.4); border-radius:99px;
  width:1.5rem; height:1.5rem; display:grid; place-items:center; flex:none; margin-top:.1rem}
.rules{border:1px solid var(--line); border-radius:var(--r); background:rgba(255,255,255,.04)}
.rules summary{cursor:pointer; padding:.8rem 1.1rem; font-size:.86rem; font-weight:700; list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules summary::before{content:'▸ '; color:var(--purple-lt)}
.rules[open] summary::before{content:'▾ '}
.rules-body{padding:0 1.1rem 1.1rem; display:grid; gap:1rem}
.rules .rule p{margin:.5rem 0 0; font-size:.88rem; color:var(--on-night-soft); line-height:1.6; max-width:62ch}
.sealed-theory .seal{--wax:radial-gradient(circle at 34% 30%,#8FE9BC 0%,#27CF77 38%,#1A9054 76%,#0E5B34 100%)}
.sealed-theory{border:1px solid rgba(39,207,119,.35); background:rgba(39,207,119,.07);
  border-radius:var(--r); padding:1.1rem 1.2rem}
.ev-list{display:grid; gap:.45rem}
.clue-evidence{display:flex; gap:.7rem; align-items:flex-start;
  border:1px dashed var(--line-2); border-radius:var(--r-sm); padding:.6rem .8rem;
  background:rgba(255,255,255,.04); font-size:.9rem}
.clue-evidence .n{font-family:var(--type); font-size:.66rem; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--on-night-faint); padding-top:.2rem; flex:none}
.clue-evidence.cited{border-style:solid; border-color:rgba(39,207,119,.55); background:rgba(39,207,119,.1)}
.clue-evidence.cited .n{color:var(--mint)}
.note{font-size:.82rem; color:var(--on-night-soft); line-height:1.55; margin:0 0 1.3rem;
  padding:.7rem .9rem; border-left:2px solid var(--purple); background:rgba(166,43,255,.09);
  border-radius:0 var(--r-sm) var(--r-sm) 0; max-width:64ch}
.warn{font-size:.78rem; color:var(--acid); margin-top:.45rem; display:flex; gap:.4rem}
.warn::before{content:'!'; font-family:var(--type); font-weight:700}
.count{font-family:var(--type); font-size:.7rem; color:var(--on-night-faint); float:right}

.btn{
  border:1px solid var(--line-2); background:rgba(255,255,255,.07); color:var(--on-night);
  border-radius:99px; padding:.6rem 1.2rem; font-size:.87rem; font-weight:700;
}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--purple); border-color:var(--purple); color:#fff}
.btn.primary:hover{background:var(--purple-dk)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,61,138,.5); color:var(--magenta)}
.btn.sm{padding:.36rem .8rem; font-size:.76rem}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn-row{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center}

/* Fichas de pista sugerida */
.clue-chips{display:flex; flex-wrap:wrap; gap:.45rem; margin-bottom:.55rem}
.chip{
  border:1px dashed var(--line-2); background:rgba(255,255,255,.04); color:var(--on-night-soft);
  border-radius:var(--r-sm); padding:.4rem .7rem; font-size:.78rem; text-align:left; max-width:100%;
}
.chip:hover{border-color:var(--purple); color:var(--on-night)}

/* ── Ruleta ─────────────────────────────────────────────── */
.wheel-stage{position:relative; width:min(400px,86vw); aspect-ratio:1; margin:0 auto}
.wheel{position:absolute; inset:0; border-radius:50%;
  border:1px solid var(--line-2);
  background:radial-gradient(circle, rgba(166,43,255,.16), transparent 68%);
  transition:transform 4.6s cubic-bezier(.15,.72,.15,1);}
.wheel .slot{position:absolute; width:11.5%; aspect-ratio:1; transform:translate(-50%,-50%);
  border-radius:50%; overflow:hidden; border:2px solid rgba(245,239,231,.5); background:var(--night-3)}
.wheel .slot img, .wheel .slot .avatar{width:100%; height:100%; object-fit:cover; display:block; border:0}
/* La rueda gira; esto gira al revés la misma cantidad, así las caras
   quedan siempre derechas. */
.wheel .slot-in{width:100%; height:100%; transition:transform 4.6s cubic-bezier(.15,.72,.15,1)}
.wheel .slot .avatar.ph{background:#2B1449}
.needle{position:absolute; left:50%; top:-6px; transform:translateX(-50%); z-index:5;
  width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent;
  border-top:20px solid var(--acid); filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.wheel-hub{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:4}
.wheel-hub:hover{transform:translate(-50%,-50%) scale(1.05)}
.wheel-hub:active{transform:translate(-50%,-50%) scale(.96)}

/* ── Persona ────────────────────────────────────────────── */
.person{display:flex; align-items:center; gap:.9rem}
.person img, .avatar{width:var(--av,54px); height:var(--av,54px); border-radius:50%; object-fit:cover;
  background:var(--night-3); flex:none; border:2px solid rgba(245,239,231,.28)}
.person .nm{font-family:var(--serif); font-size:1.15rem; line-height:1.2}
.person .rl{font-size:.78rem; color:var(--on-night-soft)}
.avatar.ph{display:grid; place-items:center; font-family:var(--serif); font-size:calc(var(--av,54px)*.42);
  color:var(--purple-lt); position:relative; overflow:hidden; line-height:1;
  background:linear-gradient(150deg,var(--night-3),#3C1D66)}
.avatar.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border:0; border-radius:inherit}

/* ── Tablas admin ───────────────────────────────────────── */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r)}
table{border-collapse:collapse; width:100%; font-size:.84rem; min-width:600px}
th,td{padding:.6rem .8rem; text-align:left; border-bottom:1px solid var(--line)}
th{font-family:var(--type); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--on-night-soft); background:rgba(0,0,0,.24); position:sticky; top:0}
tbody tr:hover{background:rgba(255,255,255,.035)}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:.45rem}
.dot.ok{background:var(--mint)} .dot.no{background:rgba(255,255,255,.2)}

/* ── Varios ─────────────────────────────────────────────── */
.divider{height:1px; background:var(--line); margin:1.6rem 0}
.badge{font-family:var(--type); font-size:.66rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; padding:.22rem .55rem; border-radius:4px}
.badge.ver{background:rgba(166,43,255,.22); color:var(--purple-lt)}
.badge.vere{background:rgba(39,207,119,.18); color:var(--mint)}
.toast{
  position:fixed; left:50%; bottom:1.6rem; transform:translateX(-50%) translateY(140%);
  background:var(--paper); color:var(--ink); padding:.75rem 1.3rem; border-radius:99px;
  font-weight:700; font-size:.86rem; z-index:400; box-shadow:0 10px 34px rgba(0,0,0,.5);
  opacity:0; pointer-events:none;
  transition:transform .34s cubic-bezier(.34,1.4,.5,1), opacity .2s;
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1}
.section{padding:2rem 0 3.4rem}
.stat{font-family:var(--serif); font-size:2.4rem; line-height:1}
.muted{color:var(--on-night-soft)}
.faint{color:var(--on-night-faint); font-size:.8rem}
.list-reset{list-style:none; margin:0; padding:0}

/* Login */
.login-wrap{min-height:100vh; display:grid; place-items:center; padding:2rem 1rem}
.login-card{max-width:520px; width:100%; text-align:center}
.gbtn{display:inline-flex; align-items:center; gap:.7rem; background:var(--paper); color:var(--ink);
  border:0; border-radius:99px; padding:.8rem 1.5rem; font-weight:700; font-size:.95rem;
  box-shadow:0 8px 26px rgba(0,0,0,.4)}
.gbtn:hover{background:#fff}
.picker{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:.6rem; margin-top:1.4rem; text-align:left}
.pick{display:flex; align-items:center; gap:.55rem; background:rgba(255,255,255,.05);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:.5rem; color:var(--on-night); font-size:.8rem; font-weight:600}
.pick:hover{border-color:var(--purple); background:rgba(166,43,255,.14)}
.pick img,.pick .avatar{--av:32px}

/* ── Modo presentación ──────────────────────────────────── */
.stage{position:fixed; inset:0; z-index:300; background:var(--night); overflow:auto;
  display:flex; flex-direction:column}
.stage::before{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60rem 40rem at 50% -10%, rgba(166,43,255,.34), transparent 62%),
             radial-gradient(48rem 34rem at 90% 100%, rgba(255,61,138,.22), transparent 60%)}
.stage-in{position:relative; z-index:1; flex:1; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  padding:clamp(1.5rem,5vh,4rem) clamp(1.25rem,6vw,5rem); gap:1.4rem; max-width:1100px; margin:0 auto; width:100%}
.stage h2{font-size:clamp(2rem,5.6vw,4rem)}
.stage .big-name{font-family:var(--serif); font-size:clamp(2.6rem,7vw,5.2rem); line-height:1.02}
.stage-bar{position:relative; z-index:2; display:flex; align-items:center; gap:.7rem;
  padding:.9rem clamp(1.25rem,6vw,5rem); border-top:1px solid var(--line)}
.stage-clues{display:grid; gap:.7rem; width:100%; max-width:720px; text-align:left}
.stage-clue{display:flex; gap:.9rem; align-items:flex-start; background:rgba(255,255,255,.05);
  border:1px solid var(--line); border-radius:var(--r); padding:.9rem 1.1rem}
.stage-clue .n{font-family:var(--type); font-size:.75rem; color:var(--acid); padding-top:.2rem}
.stage-clue.cited{border-color:rgba(39,207,119,.6); background:rgba(39,207,119,.12)}
.stage-clue.cited .n{color:var(--mint)}
.stage-clue .x{font-size:clamp(1rem,2vw,1.25rem); line-height:1.45}
.theory-box{background:rgba(255,61,138,.12); border:1px solid rgba(255,61,138,.4);
  border-radius:var(--r); padding:.9rem 1.2rem; max-width:720px; width:100%; text-align:left}
.verdict{font-family:var(--type); font-size:.8rem; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; padding:.4rem .9rem; border-radius:99px; display:inline-block}
.verdict.ok{background:rgba(39,207,119,.2); color:var(--mint)}
.verdict.no{background:rgba(255,255,255,.08); color:var(--on-night-soft)}
.progress{flex:1; height:3px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--grad,linear-gradient(90deg,var(--purple),var(--magenta)))}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}
:focus-visible{outline:2px solid var(--acid); outline-offset:2px}
</style>
</head>

/* Plantillas de pista: dan la forma, no la respuesta. Nadie recibe
   una pista prefabricada — cada quien decide qué tan cerca quiere
   dejar que le lleguen. */
const CLUE_TEMPLATES = {
  es:[
    'Una palabra que me describe: ',
    'Una de mis 5 fortalezas Clifton es ______, y se me nota cuando ',
    'Todos los días, sin falta, ',
    'Casi nadie en el equipo sabe que ',

  ],

    'Todo dia, sem falta, ',
    'Quase ninguém no time sabe que ',
    'Se você me procurar numa segunda às 8, eu estou ',
    'O que mais me custa no trabalho é ',
  ],
  en:[
    'One word that describes me: ',
    'One of my Clifton top 5 is ______, and you can tell when ',
    'Every single day, without fail, ',
    'Almost nobody on the team knows that ',
    'If you look for me on a Monday at 8, I am ',
    'The hardest part of work for me is ',
  ]
};
/* Devuelve 3 plantillas distintas por ciclo, para que las pistas de
   una misma persona no se repitan de forma. */
function clueTemplates(lang, cycleN){
  const all = CLUE_TEMPLATES[lang] || CLUE_TEMPLATES.es;
  const start = ((cycleN - 1) * 2) % all.length;
  return [all[start], all[(start + 1) % all.length], all[(start + 3) % all.length]];
}
/* Chequeo de obviedad: si la pista trae tu nombre o tu cargo, ya no
   es pista. */
function tooObvious(text, p){
  const t = text.toLowerCase();
  if (!t.trim()) return false;
  const bits = [];
  p.name.split(' ').forEach(w => { if (w.length > 3) bits.push(w.toLowerCase()); });
  (p.role || '').split(/[\s&]+/).forEach(w => { if (w.length > 4) bits.push(w.toLowerCase()); });
  return bits.some(b => t.includes(b));
}

/* ── Almacenamiento local (solo preferencias del navegador) ─

const KEY = 'cupidoplus.v1';

   nunca alcanza a mostrar ni un instante los datos de la persona
   anterior mientras Firebase confirma quién eres ahora. */

const save = () => STORE.write(S);
const t = k => (I18N[S.lang] && I18N[S.lang][k]) || I18N.es[k] || k;

/* ── Sorteo individual ────────────────────────────────────
   Cada quien saca su propia balota (transacción en Firestore):
   taken/{personId} solo existe cuando alguien ya lo escogió como
   receptor — vacío a propósito, para que ni ese documento delate la
   pareja. Se descarta el candidato que dejaría al último participante
   pendiente sin nadie más que él mismo.
   NOTA (simplificación obligada por las reglas ya publicadas): la
   versión local también evitaba las parejas mutuas (A elige a B y B
   ya había elegido a A). Para eso hacía falta leer el mapa completo
   de asignaciones. Con Firestore, assignments/{uid} solo lo puede
   leer ese mismo uid (ni el admin puede leer el de otra persona) — es
   justo lo que garantiza que el remitente no exista en ningún lugar
   legible. Sin esa lectura no hay forma de saber si el candidato ya
   te había elegido a ti, así que esa protección se quitó. Con 22
   personas el efecto es pequeño, y es el precio de que nadie —ni el
   propio Cupido+— pueda reconstruir el mapa. */
async function claim(giverId){
  const ref = db.collection('assignments').doc(S.uid);
  const already = await ref.get();
  if (already.exists) return already.data().receiverPersonId;

  const allIds = ACTIVE.map(p => p.id);
  let pick = null;
  await db.runTransaction(async (tx) => {
    /* OJO: tx.get() con un CollectionReference completo revienta en el
       SDK compat ("Expected type 'nc', but it was: a custom rc object")
       — las transacciones solo soportan leer documentos por referencia,
       así que se pide cada persona por su doc en vez de la colección entera. */
    const takenSnaps = await Promise.all(allIds.map(id => tx.get(db.collection('taken').doc(id))));
    const takenIds = new Set(takenSnaps.filter(s => s.exists).map(s => s.id));
    const free = allIds.filter(id => !takenIds.has(id));
    const pendingAfter = allIds.filter(id => id !== giverId && !takenIds.has(id));
    let cands = free.filter(r => r !== giverId);
    cands = cands.filter(r => {
      const rest = free.filter(x => x !== r);
      return !(pendingAfter.length === 1 && rest.length === 1 && rest[0] === pendingAfter[0]);
    });
    if (!cands.length) cands = free.filter(r => r !== giverId);
    if (!cands.length) cands = free.slice();
    if (!cands.length) throw new Error('sin candidatos disponibles');
    pick = cands[Math.floor(Math.random() * cands.length)];
    tx.set(db.collection('taken').doc(pick), {});
    tx.set(ref, { personId: giverId, receiverPersonId: pick, at: firebase.firestore.FieldValue.serverTimestamp() });
  });
  S.myAssignment = { personId: giverId, receiverPersonId: pick };
  refreshTakenCount();
  return pick;
}
/* receiverOf solo responde para "yo" — es lo único que las reglas
   dejan saber desde el cliente. giverTo ya no existe: nadie puede
   saber quién le escribe a quién salvo esa misma persona (y ni
   siquiera ella, a menos que se lo digan en vivo). */
const receiverOf = id => (id === S.session && S.myAssignment) ? S.myAssignment.receiverPersonId : null;
const spunCount = () => S.takenCount || 0;

/* ── Panel oculto de admin: mapa del sorteo ───────────────
   Requiere que la regla de /assignments/{uid} tenga la excepción
   "|| isAdmin()" en el read — sin eso, isMember()/isAdmin() puede
   escribir y borrar (ya lo tenían), pero no LISTAR la colección
   entera, así que esto falla con permission-denied hasta que se
   actualice esa línea en Firestore. Se guarda en variables de
   módulo (no en S) para que quede apagado por defecto en cada carga. */
let showDrawMap = false;
let drawMapCache = null; // null = no cargado, 'error' = bloqueado, [] = vacío, [...] = filas
async function loadDrawMap(){
  drawMapCache = null; render();
  try{
    const snap = await db.collection('assignments').get();
    drawMapCache = snap.docs.map(d => ({ uid: d.id, personId: d.data().personId, receiverPersonId: d.data().receiverPersonId }));
  }catch(e){
    console.error('drawMap', e);
    drawMapCache = 'error';
  }
  render();
}
async function resetOnePerson(personId){
  if (!Array.isArray(drawMapCache)) return;
  const row = drawMapCache.find(r => r.personId === personId);
  if (!row) return;
  try{
    const batch = db.batch();
    batch.delete(db.collection('assignments').doc(row.uid));
    batch.delete(db.collection('taken').doc(row.receiverPersonId));
    await batch.commit();
    await refreshTakenCount();
    await loadDrawMap();
  }catch(e){ console.error('resetOnePerson', e); toast('No se pudo reiniciar — revisa las reglas.'); }
}
/* El botón grande "Borrar todo": los regalos, teorías y cupos ya
   los puede listar/borrar isAdmin() con las reglas actuales, pero
   assignments no (ver nota arriba) — por eso va en un try/catch
   aparte y avisa si esa parte no se pudo. */
async function wipeDraws(){
  const [tsnaps, gsnaps, qsnaps] = await Promise.all([
    db.collection('taken').get(), db.collection('gifts').get(), db.collection('guesses').get()
  ]);
  const rest = [...tsnaps.docs, ...gsnaps.docs, ...qsnaps.docs];
  if (rest.length){ const b = db.batch(); rest.forEach(d => b.delete(d.ref)); await b.commit(); }
  const asnaps = await db.collection('assignments').get(); // puede tronar por permisos
  if (asnaps.docs.length){ const b2 = db.batch(); asnaps.docs.forEach(d => b2.delete(d.ref)); await b2.commit(); }
}
function refreshTakenCount(){
  return db.collection('taken').get().then(qs => { S.takenCount = qs.size; }).catch(e => console.error('taken', e));
}

/* ── Estado de ciclos ────────────────────────────────────── */
/* Bogotá está en UTC-5 todo el año (no hay horario de verano), así
   que un offset fijo basta para comparar fechas de ciclo igual sin
   importar en qué huso horario esté el navegador de quien mira (el
   equipo está repartido por Colombia, Brasil, Costa Rica, Uruguay,
   Panamá y EE.UU.). */
function bogotaDate(iso){
  return new Date((iso.length === 10 ? iso + 'T00:00:00' : iso) + '-05:00');
}
const today = () => new Date();
/* Un ciclo abre en su fecha y se queda abierto hasta la revelación
   (config/game.revealOpen: un interruptor COMPARTIDO en Firestore,
   ya no una fecha fija): quien se atrase todavía puede mandar lo
   suyo. */
function cycleState(c){
  const ov = S.cycleOverride[c.n];
  if (ov === 'open' || S.config.testMode) return 'open';
  if (ov === 'closed') return 'closed';
  const now = today();
  if (now < bogotaDate(c.start)) return 'soon';
  if (isRevealed()) return 'closed';
  return 'open';
}
function activeCycle(){
  if (S.viewCycle){
    const pick = CYCLES.find(c => c.n === S.viewCycle);
    if (pick && cycleState(pick) === 'open') return pick;
  }
  const open = CYCLES.find(c => cycleState(c) === 'open');
  if (open) return open;
  const soon = CYCLES.find(c => cycleState(c) === 'soon');
  return soon || CYCLES[CYCLES.length - 1];
}
/* revealOpen es un interruptor manual del admin (Plan Spark: sin
   Cloud Functions no hay forma de que se prenda solo a una hora
   exacta) y es también lo único que las reglas de Firestore miran
   para decidir si gifts/guesses se vuelven legibles para todo el
   equipo — por eso el cliente sigue ese mismo booleano al pie de la
   letra, sin una fecha de respaldo que podría desalinearse de lo que
   el backend realmente deja leer. */
function isRevealed(){
  return !!(S.config && S.config.revealOpen);
}
/* Ojo: el id de Firestore usa "_", no ":" — tiene que calzar exacto
   con lo que validan las reglas (giftId == cycle + '_' + to). */
const giftKey = (n, personId) => n + '_' + personId;
const getGift = (n, personId) => S.gifts[giftKey(n, personId)] || null;
const getGuess = (n, who) => S.guesses[giftKey(n, who)] || null;

/* ── Sincronización con Firestore ─────────────────────────
   Todo lo compartido (config, mi propia asignación, los regalos y
   teorías que puedo leer según las reglas) se recarga aquí. S sigue
   siendo la fuente para pintar la vista, pero Firestore manda. */
function tsToIso(v){
  if (!v) return new Date().toISOString();
  if (typeof v === 'string') return v;
  if (typeof v.toDate === 'function') return v.toDate().toISOString();
  return new Date().toISOString();
}
async function loadSharedConfig(){
  try{
    const snap = await db.collection('config').doc('game').get();
    if (snap.exists) S.config = Object.assign({}, S.config, snap.data());
  }catch(e){ console.error('config/game', e); }
}
async function setSharedConfig(patch){
  try{
    await db.collection('config').doc('game').set(patch, { merge:true });
    S.config = Object.assign({}, S.config, patch);
  }catch(e){
    console.error('config/game set', e);
    toast(S.lang === 'en' ? 'Could not save — try again.' : S.lang === 'pt' ? 'Não deu para salvar — tente de novo.' : 'No se pudo guardar — intenta de nuevo.');
  }
}
async function loadMine(me){
  try{
    const asnap = await db.collection('assignments').doc(S.uid).get();
    S.myAssignment = asnap.exists ? asnap.data() : null;
  }catch(e){ console.error('assignments', e); S.myAssignment = null; }
  await Promise.all(CYCLES.map(async c => {
    const key = giftKey(c.n, me.id);
    try{
      const g = await db.collection('gifts').doc(key).get();
      if (g.exists){ const d = g.data(); d.at = tsToIso(d.at); S.gifts[key] = d; }
    }catch(e){ /* nada recibido todavía para este ciclo */ }
    try{
      const gs = await db.collection('guesses').doc(key).get();
      if (gs.exists){ const d = gs.data(); d.at = tsToIso(d.at); S.guesses[key] = d; }
    }catch(e){ /* sin teoría enviada todavía */ }
  }));
}
/* Solo para el admin: señales de participación agregadas por persona
   (¿recibió su pieza esta semana? ¿mandó su teoría?). Nunca quién se
   la escribió — eso sigue sin poder leerse, ni siquiera con
   isAdmin(), porque las reglas de assignments/{uid} no tienen
   excepción para admin. */
async function loadAllGiftsAndGuesses(){
  await Promise.all(ACTIVE.flatMap(p => CYCLES.map(async c => {
    const key = giftKey(c.n, p.id);
    try{
      const g = await db.collection('gifts').doc(key).get();
      if (g.exists){ const d = g.data(); d.at = tsToIso(d.at); S.gifts[key] = d; }
    }catch(e){}
    try{
      const gs = await db.collection('guesses').doc(key).get();
      if (gs.exists){ const d = gs.data(); d.at = tsToIso(d.at); S.guesses[key] = d; }
    }catch(e){}
  })));
}
async function refreshAdminData(){
  await loadSharedConfig();
  await refreshTakenCount();
  await loadAllGiftsAndGuesses();
}

/* ── Utilidades de vista ─────────────────────────────────── */
/* <template> parsea también <tr>/<td>, que un <div> descartaría. */
const el = (h) => { const tpl = document.createElement('template'); tpl.innerHTML = h.trim(); return tpl.content.firstElementChild; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Inicial siempre debajo; la foto la tapa cuando carga. Si la foto
   falla (sin red), queda la inicial en vez de un círculo vacío. */
function avatar(p, size){
  const sz = size || 54;
  if (!p) return `<span class="avatar ph" style="--av:${sz}px">?</span>`;
  return `<span class="avatar ph" style="--av:${sz}px" title="${esc(p.name)}">${esc(first(p)[0])}<img src="${p.photo}" alt="${esc(p.name)}" onerror="this.remove()"></span>`;
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function fmtDate(iso){
  const loc = { es:'es-CO', pt:'pt-BR', en:'en-US' }[S.lang];
  return new Date(iso + (iso.length === 10 ? 'T12:00:00' : '')).toLocaleDateString(loc, { day:'numeric', month:'long' });
}
const cycleTitle = c => t('c' + c.n);
const cycleSub = c => t('c' + c.n + 'sub');

   ============================================================ */
let view = 'mission';
/* Variable de memoria (no se guarda ni en S ni en Firestore) para que
   el popup de "qué es esto" salga siempre que se recarga la página,
   sin importar si ya lo cerraste antes en esta misma sesión. */
let showIntro = true;

function LoadingView(){
  return el(`<div class="loading-wrap"><div class="spinner"></div><p class="muted">${t('loadingText')}</p></div>`);
}

function IntroModal(){
  const node = el(`<div class="intro-backdrop"><div class="card intro-card">
    <h3>${t('introTitle')}</h3>
    <p>${t('introBody')}</p>
    <button class="btn primary" id="introGo">${t('introGo')}</button>
  </div></div>`);
  node.querySelector('#introGo').onclick = () => { showIntro = false; render(); };
  node.onclick = (e) => { if (e.target === node) { showIntro = false; render(); } };
  return node;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  /* Mientras se resuelve el login (o se cargan los datos justo
     después de entrar), se muestra un loader en vez de dejar la
     pantalla congelada con el botón deshabilitado. */
  if (S.authBusy) { app.appendChild(LoadingView()); return; }
  if (!S.session) {
    app.appendChild(LoginView());
    if (showIntro) app.appendChild(IntroModal());
    return;
  }
  const me = byId(S.session);
  /* En modo presentación (pantalla compartida del All Hands) el popup
     no debe interrumpir, así que se salta acá. */
  if (view === 'show' && me.admin){ app.appendChild(ShowView()); return; }
  /* La primera vez, después de girar, el tutorial se abre solo. */
  if (receiverOf(me.id) && !(S.seenHelp || {})[me.id] && view === 'mission') view = 'help';
  app.appendChild(TopBar());
  const main = document.createElement('main');
  main.className = 'wrap section';
  if (me.admin && view === 'admin') main.appendChild(AdminView(me));
  else if (!receiverOf(me.id))    main.appendChild(WheelView(me));
  else if (view === 'help')       main.appendChild(HelpView(me, !(S.seenHelp || {})[me.id]));
  else if (view === 'inbox')      main.appendChild(InboxView(me));
  else if (view === 'sherlock')   main.appendChild(SherlockView(me));
  else if (view === 'reveal')     main.appendChild(RevealView(me));
  else if (view === 'admin')      main.appendChild(AdminView(me));
  else                            main.appendChild(MissionView(me));
  app.appendChild(main);
  if (showIntro) app.appendChild(IntroModal());
}

/* ── Ruleta ──────────────────────────────────────────────── */
function WheelView(me){
  const others = ACTIVE.filter(p => p.id !== me.id);
  const n = others.length;

  const node = el(`<div style="text-align:center;max-width:640px;margin:0 auto">
    <div class="eyebrow">${t('cycleOf')} 0</div>
    <h2 style="margin:.5rem 0 .6rem">${t('spinTitle')}</h2>
    <p class="lede" style="margin:0 auto 2rem">${t('spinBody')}</p>
    <div class="wheel-stage">
      <div class="needle"></div>
      <div class="wheel" id="wheel"></div>
      <button class="seal wheel-hub" style="--sz:78px" id="spin" aria-label="${t('spinBtn')}">+</button>
    </div>
    <div id="result" style="margin-top:2rem"></div>
  </div>`);

  const wheel = node.querySelector('#wheel');
  others.forEach((p, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI / 2;
    const R = 41;
    wheel.appendChild(el(`<div class="slot" style="left:${50 + Math.cos(a) * R}%;top:${50 + Math.sin(a) * R}%"><div class="slot-in">${avatar(p, 42)}</div></div>`));
  });

  const spin = node.querySelector('#spin');
  spin.onclick = async () => {
    spin.disabled = true;
    let target;
    try{
      target = byId(await claim(me.id));
    }catch(e){
      console.error(e);
      spin.disabled = false;
      toast(S.lang === 'en' ? 'Could not draw — try again.' : S.lang === 'pt' ? 'Não deu para sortear — tente de novo.' : 'No se pudo girar — intenta de nuevo.');
      return;
    }
    const idx = others.findIndex(p => p.id === target.id);
    const deg = 360 * 5 + (360 - (idx / n) * 360);
    wheel.style.transform = `rotate(${deg}deg)`;
    wheel.querySelectorAll('.slot-in').forEach(sl => { sl.style.transform = `rotate(${-deg}deg)`; });
    setTimeout(() => {
      const res = node.querySelector('#result');
      res.appendChild(el(`<div class="card accent" style="text-align:left">
        <div class="eyebrow">${t('yourPerson')}</div>
        <div class="person" style="margin:.8rem 0 1rem">
          ${avatar(target, 72)}
          <div><div class="nm">${esc(target.name)}</div>
          <div class="rl">${esc(target.role)} · ${target.country} <span class="badge ${target.team}">${target.team === 'ver' ? 'VER+' : 'VERE'}</span></div></div>
        </div>
        <p class="faint" style="margin:0 0 1.2rem">${t('keepSecret')}</p>
        <button class="btn primary" id="go">${t('navMission')} →</button>
      </div>`));
      res.querySelector('#go').onclick = () => { view = 'mission'; render(); };  // render() lo manda al tutorial si es la primera vez
      res.scrollIntoView({ behavior:'smooth', block:'center' });
    }, 4800);
  };
  return node;
}

/* ── Misión: a quién le regalas + envío del ciclo ────────── */
function MissionView(me){
  const target = byId(receiverOf(me.id));
  const c = activeCycle();
  const st = cycleState(c);
  /* Lo que YO mandé queda en gifts/{ciclo}_{target.id} (indexado por
     receptor), no en gifts/{ciclo}_{me.id} (eso sería lo que yo
     recibí, de mi propio admirador secreto). */
  const gift = getGift(c.n, target.id);

  const node = el(`<div class="grid side">
    <div>
      <div class="card accent">
        <div class="eyebrow">${t('yourPerson')}</div>
        <div class="person" style="margin:.9rem 0 1rem">
          ${avatar(target, 76)}
          <div><div class="nm">${esc(target.name)}</div>
          <div class="rl">${esc(target.role)} · ${target.country} <span class="badge ${target.team}">${target.team === 'ver' ? 'VER+' : 'VERE'}</span></div></div>
        </div>
        <p class="faint" style="margin:0">${t('keepSecret')}</p>
      </div>
      <div id="compose" style="margin-top:1.1rem"></div>
    </div>
    <div id="rail"></div>
  </div>`);

  node.querySelector('#rail').appendChild(CycleRail(me));

  const box = node.querySelector('#compose');
  if (st !== 'open'){
    box.appendChild(el(`<div class="card">
      <div class="eyebrow">${t('cycleOf')} ${c.n} ${t('ofThree')}</div>
      <h3 style="margin:.5rem 0 .3rem">${cycleTitle(c)}</h3>
      <p class="muted" style="margin:0 0 1rem">${cycleSub(c)}</p>
      <span class="postmark">${st === 'soon' ? t('closed') + ' ' + fmtDate(c.start) : t('late')}</span>
    </div>`));
    return node;
  }
  box.appendChild(Composer(me, c, gift));
  return node;
}

function Composer(me, c, gift){
  const g = gift || {};
  const rec = c.n === 2
    ? `<label class="fld"><span>${t('fSong')}</span><input class="inp" id="f_rec" value="${esc(g.rec)}" placeholder="${t('fSongPh')}"></label>
       <label class="fld"><span>${t('fLink')}</span><input class="inp" id="f_link" value="${esc(g.link)}" placeholder="${t('fLinkPh')}"></label>`
    : c.n === 3
    ? `<label class="fld"><span>${t('fRec')}</span><input class="inp" id="f_rec" value="${esc(g.rec)}" placeholder="${t('fRecPh')}"></label>
       <label class="fld"><span>${t('fWhy')}</span><textarea class="inp" id="f_link" style="min-height:80px" placeholder="${t('fWhyPh')}">${esc(g.link)}</textarea></label>`
    : '';

  const node = el(`<div class="card">
    <div style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.2rem">
      <span class="eyebrow">${t('cycleOf')} ${c.n} ${t('ofThree')}</span>
      <span class="postmark ${gift ? 'done' : 'on'}">${gift ? t('sent') : t('stOpen')}</span>
      <span class="faint">${t('cycleWindow')}: ${fmtDate(c.start)} – ${fmtDate(c.end)}</span>
    </div>
    <h3 style="margin:.4rem 0 .3rem">${cycleTitle(c)}</h3>
    <p class="muted" style="margin:0 0 .9rem">${cycleSub(c)}</p>
    <div class="note">${t('langNote')}</div>
    <label class="fld"><span>${t('fMessage')} <span class="count" id="cnt"></span></span>
      <textarea class="inp" id="f_msg" placeholder="${t('fMessagePh')}">${esc(g.message)}</textarea></label>
    ${rec}
    <label class="fld"><span>${t('fClue')}</span>
      <div class="hint" style="margin:0 0 .7rem;max-width:62ch">${t('clueGuide')}</div>
      <div class="hint" style="margin:0 0 .5rem">${t('clueSuggest')}</div>
      <div class="clue-chips" id="chips"></div>
      <input class="inp" id="f_clue" value="${esc(g.clue)}" placeholder="${t('fCluePh')}">
      <div class="warn hidden" id="obvious">${t('clueObvious')}</div></label>
    <div class="btn-row" style="margin-top:1.2rem;align-items:center;gap:1rem">
      <button class="seal" style="--sz:56px" id="send" aria-label="${gift ? t('resend') : t('send')}">+</button>
      <div><strong style="font-size:.9rem">${gift ? t('resend') : t('send')}</strong>
      <div class="faint">${gift ? fmtDate(g.at.slice(0,10)) : ''}</div></div>
    </div>
  </div>`);

  const msg = node.querySelector('#f_msg');
  const cnt = node.querySelector('#cnt');
  const upd = () => { cnt.textContent = msg.value.length; };
  msg.addEventListener('input', upd); upd();

  const chips = node.querySelector('#chips');
  const clue = node.querySelector('#f_clue');
  const warn = node.querySelector('#obvious');
  const checkClue = () => warn.classList.toggle('hidden', !tooObvious(clue.value, me));
  clue.addEventListener('input', checkClue); checkClue();
  clueTemplates(S.lang, c.n).forEach(txt => {
    const b = el(`<button class="chip" type="button">${esc(txt.trim())}…</button>`);
    b.onclick = () => { clue.value = txt; clue.focus();
      clue.setSelectionRange(clue.value.length, clue.value.length); checkClue(); };
    chips.appendChild(b);
  });

  node.querySelector('#send').onclick = async () => {
    const message = msg.value.trim();
    const clueV = clue.value.trim();
    const recV = node.querySelector('#f_rec') ? node.querySelector('#f_rec').value.trim() : '';
    const linkV = node.querySelector('#f_link') ? node.querySelector('#f_link').value.trim() : '';
    if (!message){ toast(t('fMessage')); msg.focus(); return; }
    const receiverId = S.myAssignment && S.myAssignment.receiverPersonId;
    if (!receiverId){ toast('—'); return; }
    const btn = node.querySelector('#send'); btn.disabled = true;
    try{
      await db.collection('gifts').doc(giftKey(c.n, receiverId)).set({
        cycle: c.n, to: receiverId, message, rec: recV, link: linkV, clue: clueV,
        at: firebase.firestore.FieldValue.serverTimestamp()
      });
      /* No puedo releer este documento (las reglas solo dejan leer
         gifts donde to==yo, y aquí yo soy quien lo escribe, no el
         receptor), así que el "ya lo mandé" se cachea local en este
         navegador, no en Firestore. */
      S.gifts[giftKey(c.n, receiverId)] = { cycle:c.n, to:receiverId, message, rec:recV, link:linkV, clue:clueV, at:new Date().toISOString() };
      save(); toast(t('sentOk')); render();
    }catch(e){
      console.error(e); btn.disabled = false;
      toast(S.lang === 'en' ? 'Could not send — try again.' : S.lang === 'pt' ? 'Não deu para enviar — tente de novo.' : 'No se pudo enviar — intenta de nuevo.');
    }
  };
  return node;
}

/* ── Carril de ciclos ────────────────────────────────────── */
function CycleRail(me){
  const node = el(`<div class="card"><div class="eyebrow" style="margin-bottom:1rem">${t('cycleOf')}s</div><div id="l"></div>
    <div class="divider"></div>
    <div class="faint">${t('revealTitle')} · ${fmtDate('2026-10-02')}</div></div>`);
  const l = node.querySelector('#l');
  const cur = activeCycle();
  const myTargetId = S.myAssignment && S.myAssignment.receiverPersonId;
  CYCLES.forEach(c => {
    const st = cycleState(c);
    /* Lo que YO mandé está en gifts/{ciclo}_{miObjetivo}, no en
       gifts/{ciclo}_{me.id} (eso sería lo que yo recibí). */
    const sent = !!(myTargetId && getGift(c.n, myTargetId));
    const cls = sent ? 'done' : st === 'open' ? 'on' : '';
    const lbl = sent ? t('sent') : st === 'open' ? t('stOpen') : st === 'soon' ? t('closed') + ' ' + fmtDate(c.start) : t('late');
    const isCur = c.n === cur.n;
    const row = el(`<button style="display:flex;gap:.8rem;align-items:flex-start;padding:.65rem .5rem;width:100%;text-align:left;

        <span class="faint" style="display:block;margin-top:.3rem">${fmtDate(c.start)} – ${fmtDate(c.end)}</span>
      </div></button>`);
    if (st === 'open') row.onclick = () => { S.viewCycle = c.n; save(); render(); };
    else row.style.cursor = 'default';
    l.appendChild(row);
  });
  return node;
}

/* ── Evidencia ───────────────────────────────────────────
   Se puede citar cualquier cosa que haya llegado, no solo la
   pista: a veces la canción delata más que la pista. */
function evidenceParts(cy, g){
  const out = [];
  if (g.message) out.push({ key: cy.n + ':message', label: t('partMessage'), text: g.message });
  if (g.rec)     out.push({ key: cy.n + ':rec', label: cy.n === 2 ? t('partSong') : t('partRec'), text: g.rec });
  if (g.clue)    out.push({ key: cy.n + ':clue', label: t('partClue'), text: g.clue });
  return out;
}
/* Las teorías viejas guardaban solo el número de ciclo. */
const normBased = v => (v == null || v === '') ? null : (typeof v === 'number' ? v + ':clue' : String(v));
function partLabel(key){
  key = normBased(key); if (!key) return '';
  const [n, part] = key.split(':');
  const l = part === 'message' ? t('partMessage')
          : part === 'clue' ? t('partClue')
          : (n === '2' ? t('partSong') : t('partRec'));
  return `${l} ${t('ofCycle')} ${n}`;
}
/* signals()/guessOutcome() vivían aquí: calculaban premios ("mejor
   Sherlock", "más se lo trabajó") a partir de quién escribió qué.
   Se quitaron porque le atribuirían el mérito a la persona
   equivocada: bajo el modelo de anonimato, lo único rastreable por
   id es lo que "id" RECIBIÓ, nunca lo que escribió (ver el resumen
   de la migración). Premiar así habría sido activamente incorrecto,
   no solo incompleto. */

/* ── Sherlock ────────────────────────────────────────────
   Una teoría por PIEZA recibida, no una por semana del
   calendario: si te llegaron tres sobres, puedes arriesgar
   tres veces. Cada teoría se sella al enviarla. */
function SherlockView(me){
  const received = CYCLES.map(x => ({ c:x, g: getGift(x.n, me.id) })).filter(x => x.g);
  const locked = isRevealed();

  const node = el(`<div style="max-width:740px">
    <div class="eyebrow">${received.length} / ${CYCLES.length} ${t('pieceOf').toLowerCase()}s</div>
    <h2 style="margin:.5rem 0 .7rem">${t('sherlockTitle')}</h2>
    <p class="lede" style="margin-bottom:1.6rem">${t('sherlockLede')}</p>
    <div id="pieces"></div>
  </div>`);

  const box = node.querySelector('#pieces');
  if (!received.length){
    box.appendChild(el(`<div class="card"><p class="muted" style="margin:0">${t('dossierEmpty')}</p></div>`));
    return node;
  }

  received.forEach(({ c: cy, g }) => {
    const parts = evidenceParts(cy, g);
    const gs = getGuess(cy.n, me.id);
    const on = gs ? normBased(gs.basedOn) : null;
    const card = el(`<div class="card" style="margin-bottom:1.1rem">
      <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem">
        <span class="postmark ${gs ? 'done' : 'on'}">0${cy.n} · ${cycleTitle(cy)}</span>
      </div>
      <div class="ev-list">${parts.map(ev => `<div class="clue-evidence ${on === ev.key ? 'cited' : ''}">
        <span class="n">${esc(ev.label)}</span>
        <span>${esc(ev.text.length > 190 ? ev.text.slice(0, 190) + '…' : ev.text)}</span>
        ${on === ev.key ? `<span class="postmark done" style="flex:none">${t('citedShort')}</span>` : ''}
      </div>`).join('')}</div>

      <div class="divider" style="margin:1.2rem 0"></div>
      ${gs ? `
        <div class="sealed-theory">
          <div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.9rem">
            <span class="seal" style="--sz:34px;pointer-events:none;font-size:16px">+</span>
            <div><div class="eyebrow" style="color:var(--mint)">${t('theorySealed')}</div>
              <div class="faint">${t('theoryLocked')}</div></div>
          </div>
          <div class="eyebrow">${t('myTheory')}</div>
          <div style="font-family:var(--serif);font-size:1.7rem;line-height:1.2;margin:.2rem 0 .5rem">${esc((byId(gs.guess) || {}).name || '')}</div>
          ${on ? `<div class="postmark done" style="margin-bottom:.6rem">${t('theoryOn')} ${esc(partLabel(on))}</div>` : ''}
          ${gs.why ? `<p class="muted" style="margin:0;font-family:var(--serif);font-size:1.05rem">“${esc(gs.why)}”</p>` : ''}
          <div class="btn-row" style="margin-top:1.1rem">
            <button class="btn sm" data-share>${t('theoryShare')}</button>
            <button class="btn sm" data-dl>${t('theoryDownload')}</button>
          </div>
        </div>` : `
        <div class="eyebrow" style="margin-bottom:.9rem">${t('theoryFor')}</div>
        <label class="fld"><span>${t('guessWho')}</span>
          <select class="inp" data-who><option value="">${t('chooseOne')}</option>
          ${PEOPLE.filter(p => p.id !== me.id).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
          </select></label>
        <label class="fld"><span>${t('basedOn')}</span>
          <select class="inp" data-on><option value="">${t('basedOnNone')}</option>${
            parts.map(ev => `<option value="${ev.key}">${
              esc(ev.label)} — ${esc(ev.text.slice(0, 52))}${ev.text.length > 52 ? '…' : ''}</option>`).join('')
          }</select></label>
        <label class="fld"><span>${t('guessWhy')}</span>
          <textarea class="inp" data-why style="min-height:80px"></textarea></label>
        <div class="btn-row">
          <button class="btn primary" data-send ${locked ? 'disabled' : ''}>${t('guessSend')}</button>
          <span class="faint">${t('noGuessYet')}</span>
        </div>`}
    </div>`);

    const send = card.querySelector('[data-send]');
    if (send) send.onclick = async () => {
      const w = card.querySelector('[data-who]').value;
      if (!w){ toast(t('chooseOne')); return; }
      if (!confirm(t('theoryFinalAsk'))) return;
      send.disabled = true;
      const basedOn = card.querySelector('[data-on]').value || null;
      const why = card.querySelector('[data-why]').value.trim();
      try{
        await db.collection('guesses').doc(giftKey(cy.n, me.id)).set({
          cycle: cy.n, by: me.id, guess: w, basedOn, why,
          at: firebase.firestore.FieldValue.serverTimestamp()
        });
        S.guesses[giftKey(cy.n, me.id)] = { cycle:cy.n, by:me.id, guess:w, basedOn, why, at:new Date().toISOString() };
        save(); toast(t('theorySealed')); render();
      }catch(e){
        console.error(e); send.disabled = false;
        toast(S.lang === 'en' ? 'Could not send — try again.' : S.lang === 'pt' ? 'Não deu para enviar — tente de novo.' : 'No se pudo enviar — intenta de nuevo.');
      }
    };
    const dl = card.querySelector('[data-dl]');
    if (dl) dl.onclick = () => {
      const th = getGuess(cy.n, me.id); if (!th) return;
      const key = normBased(th.basedOn);
      theoryCard(cy, th, key ? parts.find(e => e.key === key) : null);
    };
    const sh = card.querySelector('[data-share]');
    if (sh) sh.onclick = () => {
      const th = getGuess(cy.n, me.id); if (!th) return;
      const key = normBased(th.basedOn);
      const ev = key ? parts.find(e => e.key === key) : null;
      const out = [`🕵️ ${t('theoryIntro')} — ${t('cycleOf')} ${cy.n}: ${cycleTitle(cy)}`, ''];
      out.push(`${t('theoryLine')} *${(byId(th.guess) || {}).name}*.`);
      if (ev){ out.push(''); out.push(`🔍 ${t('showBecause')} ${partLabel(key)}: _${ev.text}_`); }
      if (th.why){ out.push(''); out.push('> ' + th.why.split('\n').join('\n> ')); }
      out.push(''); out.push('Cupido+');
      copyText(out.join('\n'));
    };
    box.appendChild(card);
  });
  return node;
}

/* ── Modo presentación del 25 ─────────────────────────────
   Se proyecta en el All Hands. Uno a uno: las pistas que
   recibió esa persona y su teoría. Quién se las escribió de
   verdad no lo sabe ni la app (ver nota en ShowView) — eso se
   revela en voz alta, en el momento. */
function showOrder(){
  if (!S.showOrder || S.showOrder.length !== ACTIVE.length){
    const ids = ACTIVE.map(p => p.id);
    for (let i = ids.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    S.showOrder = ids; save();
  }
  return S.showOrder;
}
/* Antes esto buscaba primero quién le escribía a "id" (giverTo) y
   luego el regalo de esa persona. Ya no hace falta: los regalos se
   guardan con id = ciclo_receptor, así que lo que "id" recibió está
   directo en getGift(cycle, id) — de paso, tampoco hace falta (ni se
   puede) saber quién es el remitente para nada de esto. */
function cluesFor(id){
  return CYCLES.map(c => ({ c, gift:getGift(c.n, id) }))
    .filter(x => x.gift && x.gift.clue)
    .map(x => ({ n:x.c.n, text:x.gift.clue }));
}
function lastTheory(id){
  let out = null;
  CYCLES.forEach(c => { const g = getGuess(c.n, id); if (g) out = { ...g, n:c.n }; });
  return out;
}
/* NOTA: aquí antes también vivía guessOutcome(id) (¿acertó su teoría?)
   y deckData incluía writtenBy/correct/pairs. Los tres necesitaban
   saber quién le escribía a quién para alguien que no fuera esa misma
   persona, y las reglas de assignments/{uid} (solo uid==auth.uid, sin
   excepción para isAdmin ni para revealOpen) lo impiden a propósito:
   ni Cupido+ mismo puede reconstruir el mapa. Por eso se quitaron —
   ver el resumen de la migración para más detalle. */
function deckData(){
  return { generatedAt:new Date().toISOString(), order:showOrder(),
    people: showOrder().map(id => {
      const p = byId(id), th = lastTheory(id);
      return { id, name:p.name, team:p.team, role:p.role,
        clues: cluesFor(id),
        theory: th ? { guess:(byId(th.guess)||{}).name, why:th.why, cycle:th.n,
          basedOn: normBased(th.basedOn), basedOnLabel: th.basedOn ? partLabel(th.basedOn) : null } : null };
    }) };
}

        <p class="lede" style="margin:0 auto;font-size:1.15rem">${t('showIntro')}</p></div>`));
      return;
    }
    if (st.k === 'end'){
      const theories = PEOPLE.reduce((n, p) => n + CYCLES.filter(c => getGuess(c.n, p.id)).length, 0);
      const sent = PEOPLE.filter(p => CYCLES.every(c => getGift(c.n, p.id))).length;
      const theoryLabel = S.lang === 'en' ? 'theories sent' : S.lang === 'pt' ? 'teorias enviadas' : 'teorías enviadas';
      body.appendChild(el(`<div style="width:100%">
        <div style="display:flex;gap:3rem;justify-content:center;margin-bottom:2.4rem;flex-wrap:wrap">
          <div><div class="stat" style="font-size:3.4rem;color:var(--mint)">${theories}</div>
            <div class="faint">${theoryLabel}</div></div>
          <div><div class="stat" style="font-size:3.4rem;color:var(--purple-lt)">${sent}</div>
            <div class="faint">${t('endComplete')}</div></div>
        </div>
        <div class="eyebrow" style="color:var(--magenta)">${t('novTag')}</div>
        <h2 style="margin-top:.8rem;font-size:clamp(1.6rem,3.6vw,2.6rem);max-width:20ch;margin-left:auto;margin-right:auto">${t('showEnd')}</h2>
      </div>`));
      return;
    }
    const p = byId(st.id);
    const clues = cluesFor(st.id);
    const th = lastTheory(st.id);
    if (st.k === 'q'){
      body.appendChild(el(`<div style="width:100%;display:grid;gap:1.4rem;justify-items:center">
        ${avatar(p, 120)}
        <div><div class="eyebrow">${t('showQ')}</div>
          <div class="big-name">${esc(p.name)}?</div></div>
        <div class="stage-clues">
          <div class="eyebrow">${t('showClues')}</div>
          ${clues.length ? clues.map(cl => `<div class="stage-clue${th && normBased(th.basedOn) === cl.n + ':clue' ? ' cited' : ''}"><span class="n">0${cl.n}</span><span class="x">${esc(cl.text)}</span></div>`).join('')
            : `<div class="stage-clue"><span class="x muted">${t('showNoClues')}</span></div>`}
        </div>
        ${th ? `<div class="theory-box"><div class="eyebrow" style="color:var(--magenta)">${t('showTheory')}</div>
          <div style="font-family:var(--serif);font-size:1.5rem;margin-top:.3rem">${esc((byId(th.guess) || {}).name || '')}</div>
          ${th.basedOn ? `<div style="font-family:var(--type);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mint);margin-top:.5rem">${t('showBecause')} ${esc(partLabel(th.basedOn))}</div>` : ''}
          ${th.why ? `<div class="muted" style="margin-top:.4rem">“${esc(th.why)}”</div>` : ''}</div>`
        : `<div class="faint">${t('showNoTheory')}</div>`}
      </div>`));
      return;
    }
    if (st.k === 'a'){
      /* Nadie puede reconstruir quién le escribió a quién, ni siquiera
         después de la revelación: assignments/{uid} solo lo lee ese
         mismo uid (ni el admin tiene excepción). Por diseño, esta
         parte se revela en vivo, no la calcula la app. */
      body.appendChild(el(`<div style="width:100%;display:grid;gap:1.5rem;justify-items:center">
        <div class="eyebrow">${esc(p.name)} · ${t('showAnswer')}</div>

  node.querySelector('#next').onclick = () => go(1);
  node.querySelector('#prev').onclick = () => go(-1);
  node.querySelector('#exit').onclick = () => { document.removeEventListener('keydown', key); view = 'admin'; render(); };
  function key(e){

    if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(-1); }
    if (e.key === 'Escape'){ document.removeEventListener('keydown', key); view = 'admin'; render(); }
  }
  document.addEventListener('keydown', key);
  draw();
  return node;
}

   Nada de esto revela al remitente: la gracia es que el
   equipo vea el regalo y la pista, y especule. */
function shareText(c, g){
  const L = { es:{songs:'🎵', shelf:'📚'}, pt:{songs:'🎵', shelf:'📚'}, en:{songs:'🎵', shelf:'📚'} }[S.lang];
  const out = [];
  out.push(`📬 ${t('shareIntro')} — ${t('cycleOf')} ${c.n}: ${cycleTitle(c)}`);
  out.push('');

    out.push('');
    out.push(`${c.n === 2 ? L.songs : L.shelf} *${g.rec}*`);
    if (g.link) out.push(g.link);
  }
  if (g.clue){
    out.push('');

  }
  out.push('');

}
function copyText(txt){
  const done = () => toast(t('shareCopied'));
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done, () => fallback(txt, done));
  } else fallback(txt, done);
}
function fallback(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ prompt('Copia esto:', txt); }
  ta.remove();
}

/* Tarjeta PNG lista para pegar en Slack */
const CARD_SKIN = {
  1:{ paper:'#F6F0E6', ink:'#14060F', seal:'#FF3D8A' },
  2:{ paper:'#F3EAF3', ink:'#14060F', seal:'#A62BFF' },
  3:{ paper:'#EDF2E7', ink:'#14060F', seal:'#27CF77' },
};
function wrapLines(ctx, text, maxW){
  const out = [];
  text.split('\n').forEach(para => {
    if (!para.trim()){ out.push(''); return; }
    let line = '';
    para.split(/\s+/).forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line){ out.push(line); line = w; }
      else line = test;
    });
    if (line) out.push(line);
  });
  return out;
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
async function shareCard(c, g){
  toast(t('shareCardMaking'));
  try { await document.fonts.ready; } catch(e){}
  const W = 1080, M = 84, pad = 52, cardY = 232;
  const innerW = W - M * 2 - pad * 2, ix = M + pad;
  const skin = CARD_SKIN[c.n];

  /* Medir primero: la tarjeta crece con el contenido en vez de
     dejar medio metro de papel en blanco. */
  const scratch = document.createElement('canvas').getContext('2d');
  scratch.font = "40px 'DM Serif Display', Georgia, serif";
  const msgLines = wrapLines(scratch, g.message, innerW).slice(0, 14);
  scratch.font = "700 30px Montserrat, sans-serif";
  const recLines = g.rec ? wrapLines(scratch, g.rec, innerW - 28).slice(0, 2) : [];
  const linkLines = (g.rec && g.link) ? wrapLines(scratch, g.link, innerW - 28).slice(0, 2) : [];
  scratch.font = "600 25px Montserrat, sans-serif";
  const clueLines = g.clue
    ? wrapLines(scratch, t('shareClue').toUpperCase() + ' · ' + g.clue, innerW - 40).slice(0, 3) : [];

  const cardH = 118 + msgLines.length * 54
    + (recLines.length ? 30 + recLines.length * 40 + linkLines.length * 30 : 0)
    + (clueLines.length ? 44 + 30 + clueLines.length * 34 : 0) + 46;
  const H = Math.round(cardY + cardH + 140);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  x.fillStyle = '#180A2B'; x.fillRect(0, 0, W, H);
  let gr = x.createRadialGradient(W * 0.15, -60, 40, W * 0.15, -60, 900);
  gr.addColorStop(0, 'rgba(166,43,255,.45)'); gr.addColorStop(1, 'rgba(166,43,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  gr = x.createRadialGradient(W, H, 40, W, H, 760);
  gr.addColorStop(0, 'rgba(255,61,138,.30)'); gr.addColorStop(1, 'rgba(255,61,138,0)');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);

  x.fillStyle = '#C97AFF';
  x.font = "700 21px 'Courier Prime', monospace";
  x.fillText('CUPIDO+  ·  AMOR Y AMISTAD 2026', M, 108);
  x.fillStyle = '#EFE6F7';
  x.font = "58px 'DM Serif Display', Georgia, serif";
  x.fillText(cycleTitle(c), M, 186);

  x.save();
  x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 44; x.shadowOffsetY = 18;
  x.fillStyle = skin.paper;
  roundRect(x, M, cardY, W - M * 2, cardH, 26); x.fill();
  x.restore();

  x.fillStyle = skin.seal;
  x.beginPath(); x.arc(W - M - 62, cardY + 62, 34, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#fff';
  x.font = "44px 'DM Serif Display', Georgia, serif";
  x.textAlign = 'center'; x.fillText('+', W - M - 62, cardY + 78); x.textAlign = 'left';

  let y = cardY + 78;
  x.fillStyle = 'rgba(20,6,15,.5)';
  x.font = "700 19px 'Courier Prime', monospace";
  x.fillText(t('from').toUpperCase(), ix, y); y += 56;

  x.fillStyle = skin.ink;
  x.font = "40px 'DM Serif Display', Georgia, serif";
  msgLines.forEach(l => { x.fillText(l, ix, y); y += 54; });

  if (recLines.length){
    y += 30;
    const barTop = y - 32, barH = recLines.length * 40 + linkLines.length * 30 - 6;
    x.strokeStyle = skin.seal; x.lineWidth = 5;
    x.beginPath(); x.moveTo(ix, barTop); x.lineTo(ix, barTop + barH); x.stroke();
    x.fillStyle = skin.ink;
    x.font = "700 30px Montserrat, sans-serif";
    recLines.forEach(l => { x.fillText(l, ix + 24, y); y += 40; });
    if (linkLines.length){
      x.fillStyle = 'rgba(20,6,15,.55)';
      x.font = "22px Montserrat, sans-serif";
      linkLines.forEach(l => { x.fillText(l, ix + 24, y); y += 30; });
    }
  }

  if (clueLines.length){
    y += 44;
    const boxH = 30 + clueLines.length * 34;
    x.strokeStyle = 'rgba(20,6,15,.28)'; x.lineWidth = 2; x.setLineDash([7, 6]);
    roundRect(x, ix, y - 30, innerW, boxH, 14); x.stroke(); x.setLineDash([]);
    x.fillStyle = 'rgba(20,6,15,.78)';
    x.font = "600 25px Montserrat, sans-serif";
    clueLines.forEach((l, i2) => x.fillText(l, ix + 20, y + i2 * 34));
  }

  x.fillStyle = 'rgba(239,230,247,.55)';
  x.font = "700 21px 'Courier Prime', monospace";
  x.textAlign = 'center';
  x.fillText(t('shareAsk'), W / 2, H - 62);

  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cupido-ciclo${c.n}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }, 'image/png');
}

  gr.addColorStop(0, 'rgba(166,43,255,.34)'); gr.addColorStop(1, 'rgba(166,43,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);

  x.fillStyle = '#8FE9BC';
  x.font = "700 21px 'Courier Prime', monospace";
  x.fillText(t('dossier').toUpperCase() + '  ·  ' + t('cycleOf').toUpperCase() + ' 0' + cy.n, M, 108);
  x.fillStyle = '#EFE6F7';
  x.font = "56px 'DM Serif Display', Georgia, serif";
  x.fillText(t('myTheory'), M, 190);

  x.save();
  x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 44; x.shadowOffsetY = 18;
  x.fillStyle = skin.paper;
  roundRect(x, M, cardY, W - M * 2, cardH, 26); x.fill();
  x.restore();

  x.fillStyle = '#27CF77';
  x.beginPath(); x.arc(W - M - 62, cardY + 62, 34, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#fff';
  x.font = "44px 'DM Serif Display', Georgia, serif";
  x.textAlign = 'center'; x.fillText('+', W - M - 62, cardY + 78); x.textAlign = 'left';

  let y = cardY + 84;
  x.fillStyle = 'rgba(20,6,15,.5)';
  x.font = "700 19px 'Courier Prime', monospace";
  x.fillText(t('theoryLine').toUpperCase(), ix, y); y += 74;
  x.fillStyle = skin.ink;
  x.font = "54px 'DM Serif Display', Georgia, serif";
  x.fillText(who, ix, y); y += 30;

  if (evLines.length){
    y += 30;
    const boxH = 30 + evLines.length * 34;
    x.strokeStyle = 'rgba(20,6,15,.28)'; x.lineWidth = 2; x.setLineDash([7, 6]);
    roundRect(x, ix, y - 30, innerW, boxH, 14); x.stroke(); x.setLineDash([]);
    x.fillStyle = 'rgba(20,6,15,.78)';
    x.font = "600 25px Montserrat, sans-serif";
    evLines.forEach((l, i) => x.fillText(l, ix + 20, y + i * 34));
    y += boxH - 30;
  }
  if (whyLines.length){
    y += 34;
    x.fillStyle = skin.ink;
    x.font = "34px 'DM Serif Display', Georgia, serif";
    whyLines.forEach(l => { x.fillText(l, ix, y); y += 46; });
  }

  x.fillStyle = 'rgba(239,230,247,.55)';
  x.font = "700 21px 'Courier Prime', monospace";
  x.textAlign = 'center';
  x.fillText('CUPIDO+  ·  AMOR Y AMISTAD 2026', W / 2, H - 62);

  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cupido-teoria-ciclo${cy.n}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }, 'image/png');
}

function download(name, text, type){
  const b = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

render();
auth.onAuthStateChanged(async (user) => {
  S.allowlistError = null;
  if (!user){
    S.session = null; S.uid = null; S.myAssignment = null;
    S.authBusy = false; save(); render();
    return;
  }
  if (!user.emailVerified){
    S.session = null; S.uid = null; S.myAssignment = null;
    S.allowlistError = 'unverified'; S.authBusy = false; render();
    return;
  }
  const email = (user.email || '').toLowerCase();
  try{
    const doc = await db.collection('allowlist').doc(email).get();
    const data = doc.exists ? doc.data() : null;
    const person = data ? byId(data.personId) : null;
    if (!data || !person){
      S.session = null; S.uid = null; S.myAssignment = null;
      S.allowlistError = 'notfound'; S.authBusy = false; render();
      return;
    }
    if (person.active === false){
      S.session = null; S.uid = null; S.myAssignment = null;
      S.allowlistError = 'inactive'; S.authBusy = false; render();
      return;
    }
    person.admin = !!data.admin;
    S.uid = user.uid;
    S.session = person.id;
    view = 'mission';
    await loadSharedConfig();
    await refreshTakenCount();
    await loadMine(person);
    if (person.admin) await loadAllGiftsAndGuesses();
  }catch(e){
    console.error(e);
    S.session = null; S.uid = null; S.myAssignment = null;
    S.allowlistError = 'error';
  }
  S.authBusy = false; save(); render();
});
</script>
