/* ════════════════════════════════════════════════════════════════
   RADAR — BETA reminder banner
   Plain HTML, meant to be embedded directly (e.g. as a Notion embed
   block, or dropped into any page). No builder UI, no export button —
   just the piece itself, content anchored top-left so it stays
   readable however the embed frame gets sized.

   TO EDIT THE COPY: change the text inside .pill / .headline / .body
   / .cta below, around line ~205.
   RADAR page link: https://velezreyes.github.io/notion-content/radar/index.html
   (set on the CTA button below — update it there if the URL ever changes).
   TO SWITCH THEME: change data-theme="dark" to data-theme="cream" on
   the <body> tag.
   ════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#EFEFE4; --black:#000000;
  --yellow:#F3FF00; --green:#27CF77; --green-light:#6FE0A7;
  --purple:#A62BFF; --purple-light:#C97AFF; --purple-dark:#6F15C4;
  --grad: linear-gradient(90deg, var(--yellow) 0%, var(--green) 50%, var(--purple) 100%);
  --font:'Montserrat',-apple-system,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
}
html,body{height:100%}
body{font-family:var(--font)}

body[data-theme="dark"]{background:#0A0A0A}
body[data-theme="cream"]{background:var(--cream)}

.banner{position:relative;overflow:hidden;min-height:100%;padding:clamp(26px,4vw,60px) clamp(26px,5vw,68px)}
body[data-theme="dark"] .banner{background:#0A0A0A;color:#fff}
body[data-theme="cream"] .banner{background:var(--cream);color:#111}

.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(128,128,128,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(128,128,128,.08) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(ellipse 70% 70% at 30% 25%,#000 30%,transparent 100%)}

.topline{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin-bottom:clamp(18px,3.4vw,38px)}
.topline svg{height:clamp(12px,1.3vw,17px);opacity:.92}
.topline .div{width:1px;height:1em;background:currentColor;opacity:.28}
.topline .word{font-family:var(--serif);font-size:clamp(.92rem,1.35vw,1.12rem);letter-spacing:.01em}

.content{position:relative;z-index:2;max-width:min(560px,58%)}
.pill{display:inline-flex;font-size:clamp(.62rem,.85vw,.75rem);font-weight:800;letter-spacing:.09em;text-transform:uppercase;border-radius:22px;padding:.4em 1.05em;margin-bottom:.9em;background:var(--green);color:#000}

.headline{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.9rem);line-height:1.08;margin-bottom:.5em}
.bodytext{font-weight:500;font-size:clamp(.82rem,1.15vw,1.02rem);line-height:1.55;max-width:480px}
body[data-theme="dark"] .bodytext{color:#C7C7C7}
body[data-theme="cream"] .bodytext{color:#5B5B50}

.cta{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:800;font-size:clamp(.76rem,1vw,.88rem);text-decoration:none;border-radius:11px;padding:.85em 1.3em;margin-top:clamp(.9em,1.6vw,1.3em);border:1.5px solid currentColor;transition:opacity .15s}
.cta:hover{opacity:.75}
body[data-theme="dark"] .cta{color:#fff}
body[data-theme="cream"] .cta{color:#111}

.gradbar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--grad);z-index:3}

/* ── animated radar-scope graphic ─────────────────────────────── */
.radarscope{position:absolute;right:clamp(-70px,-6vw,-30px);top:50%;transform:translateY(-50%);width:clamp(220px,30vw,440px);height:clamp(220px,30vw,440px);z-index:1;pointer-events:none}
.radarscope .rs-ring{position:absolute;border-radius:50%;border-style:solid;border-width:1px}
body[data-theme="dark"] .radarscope .rs-ring{border-color:rgba(166,43,255,.32)}
body[data-theme="cream"] .radarscope .rs-ring{border-color:rgba(111,21,196,.26)}
.radarscope .rs-ring.r1{inset:6%} .radarscope .rs-ring.r2{inset:23%} .radarscope .rs-ring.r3{inset:40%}
.radarscope .rs-sweep{position:absolute;inset:6%;border-radius:50%;overflow:hidden}
.radarscope .rs-sweep i{position:absolute;inset:-4%;display:block;animation:rsSpin 4.6s linear infinite}
body[data-theme="dark"] .radarscope .rs-sweep i{background:conic-gradient(from 0deg, rgba(166,43,255,.8), rgba(166,43,255,.1) 22%, rgba(166,43,255,0) 36%, rgba(166,43,255,0) 100%)}
body[data-theme="cream"] .radarscope .rs-sweep i{background:conic-gradient(from 0deg, rgba(111,21,196,.65), rgba(111,21,196,.08) 22%, rgba(111,21,196,0) 36%, rgba(111,21,196,0) 100%)}
@keyframes rsSpin{to{transform:rotate(360deg)}}
.radarscope .rs-dot{position:absolute;border-radius:50%;animation:rsBlip 4.2s ease-in-out infinite}
body[data-theme="dark"] .radarscope .rs-dot{background:var(--green-light);box-shadow:0 0 12px 3px rgba(39,207,119,.65)}
body[data-theme="cream"] .radarscope .rs-dot{background:#1A9054;box-shadow:0 0 10px 3px rgba(26,144,84,.5)}
@keyframes rsBlip{0%,88%,100%{opacity:0;transform:scale(.5)}4%{opacity:1;transform:scale(1.2)}14%{opacity:.7;transform:scale(.9)}26%{opacity:0;transform:scale(.5)}}
.radarscope .rs-center{position:absolute;width:2.6%;height:2.6%;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:rsCenter 4.6s ease-in-out infinite}
body[data-theme="dark"] .radarscope .rs-center{background:var(--purple-light);box-shadow:0 0 16px 4px rgba(166,43,255,.55)}
body[data-theme="cream"] .radarscope .rs-center{background:var(--purple-dark);box-shadow:0 0 16px 4px rgba(111,21,196,.4)}
@keyframes rsCenter{0%,100%{opacity:.75}50%{opacity:1}}

@media (max-width:640px){
  .content{max-width:100%}
  .radarscope{position:relative;right:auto;top:auto;transform:none;width:min(70vw,300px);height:min(70vw,300px);margin:1.6rem auto 0}
  .banner{padding-bottom:clamp(200px,50vw,320px)}
}
</style>
